---
apic:
  tenants:
    - name: emea-cto
      managed: false
      security_domains:
        - emea-cto

      vrfs:
        - name: vrf-conmurph-prod
        - name: vrf-conmurph-prod
          
      bridge_domains:
        - name: 10.0.10.0_24
          vrf: vrf-conmurph-prod
          unicast_routing: true
          subnets:
          - ip: 10.0.10.1/24
            public: true
          l3outs:
            - l3out-to-core-01
        - name: 10.0.20.0_24
          vrf: vrf-conmurph-prod
          subnets:
          - ip: 10.0.20.1/24
            public: true
          l3outs:
            - l3out-to-core-01
        - name: 10.0.30.0_24
          vrf: vrf-conmurph-prod
          subnets:
          - ip: 10.0.30.1/24
            public: true
          l3outs:
            - l3out-to-core-01

      application_profiles:
        - name: conmurph-nac-security-groups
          endpoint_security_groups:
            - name: all-services
              vrf: vrf-conmurph-prod
              epg_selectors:
                - endpoint_group: 10.0.10.0_24
                  application_profile: conmurph-nac-network-segments
                - endpoint_group: 10.0.20.0_24
                  application_profile: conmurph-nac-network-segments
                # - endpoint_group: 10.0.30.0_24
                #   application_profile: conmurph-nac-network-segments
              
              contracts:
                providers:
                  - permit-all-to-conmurph-nac

        - name: conmurph-nac-network-segments
          endpoint_groups: 
            - name: 10.0.10.0_24
              bridge_domain: 10.0.10.0_24
              physical_domains:
                - emea-cto.phys-dom
              static_ports:
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-A
                  vlan: 10
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-B
                  vlan: 10
                  deployment_immediacy: immediate
            - name: 10.0.20.0_24
              bridge_domain: 10.0.20.0_24
              physical_domains:
                - emea-cto.phys-dom
              static_ports:
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-A
                  vlan: 20
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-B
                  vlan: 20
                  deployment_immediacy: immediate
            - name: 10.0.30.0_24
              bridge_domain: 10.0.30.0_24
              physical_domains:
                - emea-cto.phys-dom
              static_ports:
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-A
                  vlan: 30
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-B
                  vlan: 30
                  deployment_immediacy: immediate

      filters:
        - name: icmp
          entries:
            - name: icmp
              ethertype: ip
              protocol: icmp
        - name: web
          entries:
            - name: http
              ethertype: ip
              protocol: tcp
              destination_from_port: http
              destination_to_port: http
        - name: conmurph-nac-all-protocols
          entries:
            - name: any
              ethertype: unspecified

      contracts:  
        - name: permit-all-to-conmurph-nac
          subjects:
            - name: permit-any
              filters:
                - filter: conmurph-nac-all-protocols
                  log: true
  
      l3outs:
        - name: l3out-to-core-01
          vrf: vrf-external
          domain: emea-cto.routed-dom
          bgp:
            name: bgp-l3out-to-core

          node_profiles:
            - name: border-leafs
              nodes:
                - node_id: 1101
                  router_id: 101.2.1.1
                  router_id_as_loopback: false

                - node_id: 1102
                  router_id: 102.2.1.1
                  router_id_as_loopback: false

              interface_profiles:
                - name: aci-site-01-pod-01-leaf-switches
                  interfaces: 
                    - node_id: 1101
                      node2_id: 1102
                      channel: vpc-routed-interfaces-to-core
                      vlan: 1290
                      svi: true
                      ip_a: 172.16.1.210/29
                      ip_b: 172.16.1.211/29
                      ip_shared: 172.16.1.212/29
                      bgp_peers:
                      - ip: 172.16.1.209/29 
                        local_as: 65521
                        remote_as: 65500    

          external_endpoint_groups:
            - name: all-subnets
              subnets:
                - prefix: 0.0.0.0/1
                - prefix: 128.0.0.0/1
              contracts:
                consumers:
                  - permit-all-to-tenant-emea-cto   

        - name: l3out-to-conmurph-ftdv-01
          vrf: vrf-external
          domain: emea-cto.routed-dom
          bgp:
            name: bgp-l3out-to-conmurph-ftdv-01
          # ospf:
          #   area: 0
          #   area_type: regular
          #   ospf_interface_profile_name: conmurph-ospf-to-ftdv
          #   policy: conmurph-ospf-to-ftdv

          node_profiles:
            - name: border-leafs
              nodes:
                - node_id: 1101
                  router_id: 101.2.1.1
                  router_id_as_loopback: false

                - node_id: 1102
                  router_id: 102.2.1.1
                  router_id_as_loopback: false

              interface_profiles:
                - name: aci-site-01-pod-01-leaf-switches
                  # ospf:
                  #   ospf_interface_profile_name: conmurph-ospf-to-ftdv
                  interfaces: 
                    - node_id: 1101
                      node2_id: 1102
                      channel: vpc-ucs-prod-01-6454-A
                      vlan: 1299
                      svi: true
                      ip_a: 6.6.6.2/24
                      ip_b: 6.6.6.3/24
                      ip_shared: 6.6.6.1/24
                      bgp_peers:
                      - ip: 6.6.6.0/24
                        # local_as: 65661
                        remote_as: 65662   

                    - node_id: 1101
                      node2_id: 1102
                      channel: vpc-ucs-prod-01-6454-B
                      vlan: 1299
                      svi: true
                      ip_a: 6.6.6.2/24
                      ip_b: 6.6.6.3/24
                      ip_shared: 6.6.6.1/24
                      bgp_peers:
                      - ip: 6.6.6.0/24
                        # local_as: 65661
                        remote_as: 65662                                           

          external_endpoint_groups:
            - name: all-subnets
              subnets:
                # - prefix: 6.6.6.0/24
                - prefix: 10.10.10.0/24
                - prefix: 10.10.20.0/24
              contracts:
                consumers:
                  - permit-all-to-tenant-emea-cto
      
        