---
apic:
  tenants:
    - name: emea-cto
      managed: false
      security_domains:
        - emea-cto

      vrfs:
        - name: vrf-external
        # - name: vrf-external
          
      bridge_domains:
        - name: 198.18.215.0_26 # nac-webinar
          alias: conmurph-nac-webinar
          vrf: vrf-external
          subnets:
          - ip: 198.18.215.1/26
            public: true
          l3outs:
            - l3out-to-core-01
          dhcp_labels:
            - dhcp_relay_policy: dhcp.emea-se.dcloud.cisco.com
              scope: tenant
        - name: 198.18.215.64_26 # nac-webinar
          alias: conmurph-nac-webinar
          vrf: vrf-external
          subnets:
          - ip: 198.18.215.65/26
            public: true
          l3outs:
            - l3out-to-core-01
          dhcp_labels:
            - dhcp_relay_policy: dhcp.emea-se.dcloud.cisco.com
              scope: tenant
        - name: 198.18.215.128_26 # nac-webinar
          alias: conmurph-nac-webina
          vrf: vrf-external
          subnets:
          - ip: 198.18.215.129/26
            public: true
          # l3outs:
          #   - l3out-to-core-01
          dhcp_labels:
            - dhcp_relay_policy: dhcp.emea-se.dcloud.cisco.com
              scope: tenant

      application_profiles:
        - name: security-groups
          managed: false
          endpoint_security_groups:
            - name: all-services
              vrf: vrf-external
              epg_selectors:
                - endpoint_group: 198.18.215.0_26 
                  application_profile: network-segments
                - endpoint_group: 198.18.215.64_26 
                  application_profile: network-segments
                - endpoint_group: 198.18.215.128_26 
                  application_profile: network-segments
              
              contracts:
                providers:
                  - permit-all-to-conmurph-nac

        - name: network-segments
          managed: false
          endpoint_groups: 
            - name: 198.18.215.0_26 # nac-webinar
              bridge_domain: 198.18.215.0_26 
              physical_domains:
                - emea-cto.phys-dom
              static_ports:
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-A
                  vlan: 1228
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-B
                  vlan: 1228
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-prod-01-6454-A
                  vlan: 1228
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-prod-01-6454-B
                  vlan: 1228
                  deployment_immediacy: immediate
            - name: 198.18.215.64_26 # nac-webinar
              bridge_domain: 198.18.215.64_26 
              physical_domains:
                - emea-cto.phys-dom
              static_ports:
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-A
                  vlan: 1229
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-B
                  vlan: 1229
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-prod-01-6454-A
                  vlan: 1229
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-prod-01-6454-B
                  vlan: 1229
                  deployment_immediacy: immediate
            - name: 198.18.215.128_26 # nac-webinar
              bridge_domain: 198.18.215.128_26 
              physical_domains:
                - emea-cto.phys-dom
              static_ports:
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-A
                  vlan: 1230
                  deployment_immediacy: immediate
                - node_id: 1101
                  node2_id: 1102
                  channel: vpc-ucs-test-01-6536-B
                  vlan: 1230
                  deployment_immediacy: immediate
                # - node_id: 1101
                #   node2_id: 1102
                #   channel: vpc-ucs-prod-01-6454-A
                #   vlan: 1230
                #   deployment_immediacy: immediate
                # - node_id: 1101
                #   node2_id: 1102
                #   channel: vpc-ucs-prod-01-6454-B
                #   vlan: 1230
                #   deployment_immediacy: immediate

      filters:
        - name: icmp
          entries:
            - name: icmp
              ethertype: ip
              protocol: icmp
        - name: web
          entries:
            - name: http
              ethertype: ip
              protocol: tcp
              destination_from_port: http
              destination_to_port: http
        - name: conmurph-nac-all-protocols
          entries:
            - name: any
              ethertype: unspecified

      contracts:  
        - name: permit-all-to-conmurph-nac
          subjects:
            - name: permit-any
              filters:
                - filter: conmurph-nac-all-protocols
                  log: true
  
      l3outs:
        - name: l3out-to-core-01
          vrf: vrf-external
          domain: emea-cto.routed-dom
          bgp:
            name: bgp-l3out-to-core

          node_profiles:
            - name: border-leafs
              nodes:
                - node_id: 1101
                  router_id: 101.2.1.1
                  router_id_as_loopback: false

                - node_id: 1102
                  router_id: 102.2.1.1
                  router_id_as_loopback: false

              interface_profiles:
                - name: aci-site-01-pod-01-leaf-switches
                  interfaces: 
                    - node_id: 1101
                      node2_id: 1102
                      channel: vpc-routed-interfaces-to-core
                      vlan: 1290
                      svi: true
                      ip_a: 172.16.1.210/29
                      ip_b: 172.16.1.211/29
                      ip_shared: 172.16.1.212/29
                      bgp_peers:
                      - ip: 172.16.1.209/29 
                        local_as: 65521
                        remote_as: 65500    

          external_endpoint_groups:
            - name: all-subnets
              subnets:
                - prefix: 0.0.0.0/1
                - prefix: 128.0.0.0/1
              contracts:
                consumers:
                  - permit-all-to-conmurph-nac
