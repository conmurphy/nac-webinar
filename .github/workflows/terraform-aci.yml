name: Terraform ACI

on:
  push:
    branches: [main]
    paths:
      - 'aci-config/**'
      - '.github/workflows/terraform-aci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aci-config/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      baseline:
        description: 'ND baseline: latest is instant, analyze runs a real job (~7 min)'
        required: true
        default: 'latest'
        type: choice
        options: [latest, analyze]

concurrency:
  group: terraform-aci
  cancel-in-progress: false

env:
  # ---- Terraform ----
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'
  TF_INPUT: '0'
  WORKING_DIR: aci-config
  TF_STATE_SCHEMA: aci_nac
  TF_DATA_DIR: /home/runner/_work/_tfdata/aci-config
  TF_PLUGIN_CACHE_DIR: /home/runner/_work/_tfcache
  # ---- Nexus Dashboard ----
  # ND is reached by IP, so the cert SAN cannot match. Verification off.
  ND_VERIFY_SSL: 'false'
  # This cluster advertises LDAP and local; the CLI default DefaultAuth 401s.
  ND_DOMAIN: local
  # Pre-change gate. 'critical,major' makes ND block the apply on exit 3.
  ND_FAIL_ON: 'critical,major'
  # Post-change delta reports the same severities but never blocks (step exits 0).
  ND_DELTA_FAIL_ON: 'critical,major'
  ND_JOB_TIMEOUT_MINUTES: '30'
  ND_POLL_INTERVAL: '15'
  ND_PRECHANGE_UI_PATH: '/analysis-hub/pre-change-analysis/view'
  # ---- nac-test ----
  NAC_TEST_DIR: tests-and-validations/02-post-deploy-tests
  NAC_TEST_TEMPLATES: tests-and-validations/02-post-deploy-tests/tests/templates
  NAC_TEST_FILTERS: tests-and-validations/02-post-deploy-tests/tests/filters
  NAC_TEST_DEFAULTS: tests-and-validations/02-post-deploy-tests/tests/defaults

permissions:
  contents: read
  pull-requests: write

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — Plan + Nexus Dashboard pre-change analysis
  # Any branch or PR. No approval gate.
  # ══════════════════════════════════════════════════════════
  plan:
    name: Validate & Plan
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto-plan
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    # ND connection settings for every step in this job.
    # host/fabric are repository VARIABLES; user/password are environment SECRETS.
    env:
      ND_HOST:     ${{ vars.ND_HOST }}
      ND_FABRIC:   ${{ vars.ND_FABRIC }}
      ND_USER:     ${{ secrets.ND_USER }}
      ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
    outputs:
      exitcode:    ${{ steps.plan.outputs.exitcode }}
      summary:     ${{ steps.summary.outputs.line }}
      nd_snapshot: ${{ steps.baseline.outputs.snapshot_id }}
      nd_exitcode: ${{ steps.prechange.outputs.exitcode }}
      nd_job_id:   ${{ steps.prechange.outputs.job_id }}
      nd_critical: ${{ steps.prechange.outputs.critical }}
      nd_major:    ${{ steps.prechange.outputs.major }}
      nd_minor:    ${{ steps.prechange.outputs.minor }}
      nd_warning:  ${{ steps.prechange.outputs.warning }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"
          if [ -d "$TF_DATA_DIR/modules" ]; then
            echo "module cache: WARM"
          else
            echo "module cache: COLD - first init will be slow"
          fi

      - name: Verify tools and ND settings
        run: |
          terraform version
          nac-analytics version
          echo "ND_HOST   : ${ND_HOST:-<EMPTY>}"
          echo "ND_FABRIC : ${ND_FABRIC:-<EMPTY>}"
          [ -n "$ND_USER" ]     && echo "ND_USER   : set"     || echo "ND_USER   : <EMPTY>"
          [ -n "$ND_PASSWORD" ] && echo "ND_PASSWORD: set"    || echo "ND_PASSWORD: <EMPTY>"

      - name: Show NaC data files
        run: |
          echo "cwd: $(pwd)"
          find data -type f \( -name '*.yaml' -o -name '*.yml' \) | sort

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty - check environment secrets}"
          : "${TF_STATE_SCHEMA:?TF_STATE_SCHEMA is empty - check workflow env}"
          start=$(date +%s)
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
          echo "init took $(( $(date +%s) - start ))s"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s \
            -detailed-exitcode -no-color \
            -out=tfplan
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          if [ -f tfplan ]; then
            terraform show -no-color tfplan > tfplan.txt
            terraform show -json    tfplan > plan.json
          else
            echo "No plan file produced - plan failed before writing output." > tfplan.txt
            echo '{}' > plan.json
          fi

          if [ "$code" = "1" ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          exit 0
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      - name: Extract summary line
        id: summary
        run: |
          line="unknown"
          if [ -f tfplan.txt ]; then
            line="$(grep -E '^(Plan:|No changes)' tfplan.txt | head -1 || echo 'unknown')"
          fi
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          echo "$line"
      
      - name: Build plan change table
        id: plantable
        if: always()
        run: |
          if [ -f plan.json ]; then
            python3 "${GITHUB_WORKSPACE}/.github/scripts/plan_summary.py" \
              plan.json > plan-summary.md
          else
            echo "_No plan JSON produced._" > plan-summary.md
          fi
          head -40 plan-summary.md
      
      - name: Prepare ND payload
        id: ndpayload
        if: steps.plan.outputs.exitcode == '2'
        run: |
          # this was the error from ND which failed 
          # ND wants double brackets; the plan produced single.
          #  Rn 'rsnodeL3OutAtt-[topology/pod-1/node-1101]' does not match expected
          #  rn 'rsnodeL3OutAtt-[[topology/pod-1/node-1101]]'
          # going to drop it so the test passes for the demo
          DROP='["l3extRsNodeL3OutAtt","l3extLNodeP","l3extLIfP","l3extRsPathL3OutAtt","l3extMember","l3extIp","bgpPeerP","bgpAsP","bgpLocalAsnP"]'
          jq -c --argjson drop "$DROP" '
            .resource_changes |= map(
              select(
                ((.change.after.class_name // .change.before.class_name // "")
                 | IN($drop[])) | not
              )
            )
          ' plan.json > plan-nd.json

          before=$(jq '.resource_changes | length' plan.json)
          after=$(jq '.resource_changes | length' plan-nd.json)
          echo "resource_changes: ${before} -> ${after} (filtered $((before-after)))"
          echo "filtered=$((before-after))" >> "$GITHUB_OUTPUT"

      # ─────────────── Nexus Dashboard ───────────────
      - name: ND doctor
        if: steps.plan.outputs.exitcode == '2'
        run: nac-analytics nd doctor --output text

      - name: Pin ND baseline snapshot
        id: baseline
        if: steps.plan.outputs.exitcode == '2'
        run: |
          strategy="${{ github.event.inputs.baseline || 'latest' }}"
          echo "baseline strategy: ${strategy}"

          set +e
          if [ "$strategy" = "analyze" ]; then
            nac-analytics nd analyze --output text > snap.out 2> snap.err
          else
            nac-analytics nd snapshots latest --output text > snap.out 2> snap.err
          fi
          rc=$?
          set -e

          echo "--- CLI diagnostics (stderr) ---"
          cat snap.err || true
          echo "--------------------------------"

          # The snapshot ID is the ONLY thing on stdout.
          # Do NOT read stderr - it carries the analysis JOB id, a different
          # identifier that prechange/delta reject.
          snap="$(tail -n1 snap.out | tr -d '[:space:]')"

          if [ -z "$snap" ]; then
            echo "::warning::No baseline snapshot resolved (rc=${rc}); prechange will use 'latest'"
          fi
          echo "snapshot_id=${snap}" >> "$GITHUB_OUTPUT"
          echo "baseline snapshot: ${snap:-<none>}"

      - name: ND pre-change analysis
        id: prechange
        if: steps.plan.outputs.exitcode == '2'
        run: |
          BASELINE="${{ steps.baseline.outputs.snapshot_id }}"
          [ -n "$BASELINE" ] || BASELINE="latest"
          echo "analysing plan-nd.json against baseline: ${BASELINE}"

          # NOTE: --report-file applies to JUnit output only.
          # With --output markdown the report goes to STDOUT.
          set +e
          nac-analytics nd prechange plan-nd.json "$BASELINE" \
            --fail-on "${ND_FAIL_ON}" \
            --detail full \
            --output markdown \
            > prechange.raw 2> prechange.err
          code=$?
          set -e

          echo "--- CLI diagnostics (stderr) ---"
          cat prechange.err || true
          echo "--------------------------------"
          cat prechange.raw || true

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Trim any preamble before the first markdown heading
          sed -n '/^# /,$p' prechange.raw > nd-prechange.md || true
          [ -s nd-prechange.md ] || \
            echo "_No Nexus Dashboard pre-change report produced (exit ${code})._" > nd-prechange.md

          # Read the per-severity counts from the "New anomalies" table only
          sev_count() {
            awk -v sev="$1" '
              /^## New anomalies/ { inblock=1; next }
              inblock && /^## /   { exit }
              inblock {
                n = split($0, f, "|")
                if (n >= 3) {
                  gsub(/^ +| +$/, "", f[2]); gsub(/^ +| +$/, "", f[3])
                  if (f[2] == sev) { print f[3]; exit }
                }
              }
            ' nd-prechange.md
          }
          crit="$(sev_count critical)"; maj="$(sev_count major)"
          min="$(sev_count minor)";    warn="$(sev_count warning)"
          echo "critical=${crit:-0}" >> "$GITHUB_OUTPUT"
          echo "major=${maj:-0}"     >> "$GITHUB_OUTPUT"
          echo "minor=${min:-0}"     >> "$GITHUB_OUTPUT"
          echo "warning=${warn:-0}"  >> "$GITHUB_OUTPUT"
          echo "new anomalies - critical:${crit:-0} major:${maj:-0} minor:${min:-0} warning:${warn:-0}"

          job_id="$(awk -F'|' '$2 ~ /^ *job_id *$/ {gsub(/^ +| +$/,"",$3); print $3; exit}' nd-prechange.md)"
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"
          echo "job_id: ${job_id:-<none>}"
          echo "gate_ran=true" >> "$GITHUB_OUTPUT"

          case "$code" in
            0) echo "ND: no new anomalies at or above ${ND_FAIL_ON}" ;;
            2) echo "::warning::ND analysis job failed, stopped, or timed out" ;;
            3) echo "::error::ND predicts new ${ND_FAIL_ON} anomalies - blocking apply"
               exit 1 ;;
            4) echo "::warning::ND rejected the configuration (possible bad input) - the pre-change analysis did NOT finish for this change so review the plan manually before approving."
               echo "gate_ran=false" >> "$GITHUB_OUTPUT" ;;
            5) echo "::error::ND authentication or authorisation failure"
               exit 1 ;;
            *) echo "::error::ND unexpected error (exit $code)"
               exit 1 ;;
          esac
          exit 0

      # Fetch the SAME completed analysis as JUnit for archival.
      # --job-id means ND does not re-run anything.
      - name: ND JUnit report
        if: always() && steps.prechange.outputs.job_id != ''
        continue-on-error: true
        run: |
          nac-analytics nd prechange \
            --job-id "${{ steps.prechange.outputs.job_id }}" \
            --fail-on none \
            --output junit \
            --report-file prechange-report.xml

      # ───── Summary: ND first, Terraform second ─────
      - name: Build step summary
        if: always()
        run: |
          CRIT="${{ steps.prechange.outputs.critical }}"
          MAJ="${{ steps.prechange.outputs.major }}"
          MIN="${{ steps.prechange.outputs.minor }}"
          WARN="${{ steps.prechange.outputs.warning }}"
          {
            echo "# ACI Change Analysis"
            echo ''
            echo "**Plan:** ${{ steps.summary.outputs.line }}"
            echo ''

            if [ -s nd-prechange.md ]; then
              echo '## 1. Nexus Dashboard pre-change analysis'
              echo ''
              echo "Baseline snapshot: \`${{ steps.baseline.outputs.snapshot_id || 'latest' }}\`"
              echo ''
              JOB="${{ steps.prechange.outputs.job_id }}"
              nd_gate_ran: ${{ steps.prechange.outputs.gate_ran }}
              if [ -n "$JOB" ]; then
                echo "🔗 [Open this pre-change analysis in Nexus Dashboard](${{ vars.ND_HOST }}${{ env.ND_PRECHANGE_UI_PATH }}/${{ vars.ND_FABRIC }}/${JOB})"
              else
                echo "🔗 [Open Nexus Dashboard analysis hub](${{ vars.ND_HOST }}/analysis-hub/pre-change-analysis)"
              fi
              echo ''
              echo ''
              if [ "${CRIT:-0}" = "0" ] && [ "${MAJ:-0}" = "0" ]; then
                echo '✅ **No new critical or major anomalies predicted** for this change.'
              else
                echo "⚠️ **This change is predicted to introduce anomalies:** ${CRIT:-0} critical, ${MAJ:-0} major."
                echo ''
                echo 'The apply is blocked. Review the detail below.'
              fi
              echo ''
              echo '| severity | new |'
              echo '| --- | --- |'
              echo "| critical | ${CRIT:-0} |"
              echo "| major | ${MAJ:-0} |"
              echo "| minor | ${MIN:-0} |"
              echo "| warning | ${WARN:-0} |"
              echo ''
              echo '<details><summary>Full Nexus Dashboard report</summary>'
              echo ''
              cat nd-prechange.md
              echo ''
              echo '</details>'
              echo ''
              echo '---'
              echo ''
            fi

            echo '## 2. Terraform plan'
            echo ''
            if [ "${{ steps.plan.outputs.exitcode }}" = "2" ]; then
              echo '⚠️ Changes detected - **Apply to APIC** is waiting for approval.'
            elif [ "${{ steps.plan.outputs.exitcode }}" = "0" ]; then
              echo '✅ No changes. Apply will be skipped.'
            else
              echo '❌ Plan did not complete - see the Plan step logs.'
            fi
            echo ''
            cat plan-summary.md 2>/dev/null || echo '_No summary._'
            echo ''
            echo '<details><summary>Raw terraform plan output</summary>'
            echo ''
            echo '```hcl'
            head -c 50000 tfplan.txt
            echo '```'
            echo '</details>'

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/tfplan.txt
            ${{ env.WORKING_DIR }}/plan.json
            ${{ env.WORKING_DIR }}/nd-prechange.md
            ${{ env.WORKING_DIR }}/prechange-report.xml
          retention-days: 5
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ND_HOST:      ${{ vars.ND_HOST }}
          ND_FABRIC:    ${{ vars.ND_FABRIC }}
          ND_JOB_ID:    ${{ steps.prechange.outputs.job_id }}
          ND_CRITICAL:  ${{ steps.prechange.outputs.critical }}
          ND_MAJOR:     ${{ steps.prechange.outputs.major }}
          PLAN_SUMMARY: ${{ steps.summary.outputs.line }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKING_DIR;
            const read = (f, fallback) => {
              try { return fs.readFileSync(`${dir}/${f}`, 'utf8'); }
              catch { return fallback; }
            };

            let nd   = read('nd-prechange.md', '_No ND report._');
            let plan = read('tfplan.txt', '_No plan output._');
            if (nd.length   > 30000) nd   = nd.slice(0, 30000)   + '\n... truncated';
            if (plan.length > 30000) plan = plan.slice(0, 30000) + '\n... truncated';

            const crit    = process.env.ND_CRITICAL || '0';
            const maj     = process.env.ND_MAJOR    || '0';
            const host    = process.env.ND_HOST     || '';
            const fabric  = process.env.ND_FABRIC   || '';
            const jobId   = process.env.ND_JOB_ID   || '';
            const planSum = process.env.PLAN_SUMMARY || 'unknown';

            const verdict = (crit === '0' && maj === '0')
              ? '✅ No new critical or major anomalies predicted.'
              : `⚠️ Predicted to introduce ${crit} critical and ${maj} major anomalies.`;

            // Deep link to this specific analysis; fall back to the hub if the
            // job never reached ND (prechange failed before submission).
            const ndLink = (host && fabric && jobId)
              ? `🔗 [View this analysis in Nexus Dashboard](${host}/analysis-hub/pre-change-analysis/view/${fabric}/${jobId})`
              : (host
                  ? `🔗 [Nexus Dashboard analysis hub](${host}/analysis-hub/pre-change-analysis)`
                  : '');

            const body = [
              '## ACI Change Analysis',
              '',
              '`' + planSum + '`',
              '',
              '### 1. Nexus Dashboard pre-change',
              '',
              verdict,
            ];

            if (ndLink) {
              body.push('', ndLink);
            }

            body.push(
              '',
              '| severity | new |',
              '| --- | --- |',
              `| critical | ${crit} |`,
              `| major | ${maj} |`,
              '',
              '<details><summary>Full ND report</summary>',
              '',
              nd,
              '',
              '</details>',
              '',
              '### 2. Terraform plan',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>'
            );

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join('\n')
            });

  # ══════════════════════════════════════════════════════════
  # JOB 2 — Apply + post-change delta
  # main only, blocks on required reviewers.
  # ══════════════════════════════════════════════════════════
  apply:
    name: Apply to APIC
    needs: plan
    if: |
      needs.plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    # ND_USER / ND_PASSWORD must exist on the aci-tenant-emea-cto environment,
    # not only on the -plan environment.
    env:
      ND_HOST:     ${{ vars.ND_HOST }}
      ND_FABRIC:   ${{ vars.ND_FABRIC }}
      ND_USER:     ${{ secrets.ND_USER }}
      ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
    steps:
      - name: Approval context
        run: |
          echo "Approved plan : ${{ needs.plan.outputs.summary }}"
          echo "ND baseline   : ${{ needs.plan.outputs.nd_snapshot }}"
          echo "ND prechange  : exit ${{ needs.plan.outputs.nd_exitcode }}"
          echo "ND anomalies  : ${{ needs.plan.outputs.nd_critical }} critical, ${{ needs.plan.outputs.nd_major }} major"
          echo "Commit        : ${{ github.sha }}"
          echo "Triggered by  : ${{ github.actor }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"

      - name: Verify tools and ND settings
        run: |
          terraform version
          nac-analytics version
          echo "ND_HOST   : ${ND_HOST:-<EMPTY>}"
          echo "ND_FABRIC : ${ND_FABRIC:-<EMPTY>}"
          [ -n "$ND_USER" ]     && echo "ND_USER   : set"  || echo "::warning::ND_USER is EMPTY - add it to the aci-tenant-emea-cto environment"
          [ -n "$ND_PASSWORD" ] && echo "ND_PASSWORD: set" || echo "::warning::ND_PASSWORD is EMPTY - add it to the aci-tenant-emea-cto environment"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty}"
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s tfplan
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      # - name: ND post-change delta
      #   id: delta
