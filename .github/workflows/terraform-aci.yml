name: Terraform ACI

on:
  push:
    branches: [main]
    paths:
      - 'aci-config/**'
      - '.github/workflows/terraform-aci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aci-config/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      baseline:
        description: 'ND baseline: latest is instant, analyze runs a real job (~7 min)'
        required: true
        default: 'latest'
        type: choice
        options: [latest, analyze]

concurrency:
  group: terraform-aci
  cancel-in-progress: false

env:
  # ---- Terraform ----
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'
  TF_INPUT: '0'
  WORKING_DIR: aci-config
  TF_STATE_SCHEMA: aci_nac
  TF_DATA_DIR: /home/runner/_work/_tfdata/aci-config
  TF_PLUGIN_CACHE_DIR: /home/runner/_work/_tfcache
  # ---- Nexus Dashboard ----
  # ND is reached by IP, so the cert SAN cannot match. Verification off.
  ND_VERIFY_SSL: 'false'
  # This cluster advertises LDAP and local; the CLI default DefaultAuth 401s.
  ND_DOMAIN: local
  # Pre-change gate: 'none' reports only. Use 'critical,major' to block the apply.
  ND_FAIL_ON: none
  # Post-change delta is informational; leave as none.
  ND_DELTA_FAIL_ON: none
  ND_JOB_TIMEOUT_MINUTES: '30'
  ND_POLL_INTERVAL: '15'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — Plan + Nexus Dashboard pre-change analysis
  # Any branch or PR. No approval gate.
  # ══════════════════════════════════════════════════════════
  plan:
    name: Validate & Plan
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto-plan
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      exitcode:    ${{ steps.plan.outputs.exitcode }}
      summary:     ${{ steps.summary.outputs.line }}
      nd_snapshot: ${{ steps.baseline.outputs.snapshot_id }}
      nd_exitcode: ${{ steps.prechange.outputs.exitcode }}
      nd_job_id:   ${{ steps.prechange.outputs.job_id }}
      nd_ui_url:   ${{ steps.prechange.outputs.ui_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"
          if [ -d "$TF_DATA_DIR/modules" ]; then
            echo "module cache: WARM"
          else
            echo "module cache: COLD - first init will be slow"
          fi

      - name: Verify tools
        run: |
          terraform version
          nac-analytics version

      - name: Show NaC data files
        run: |
          echo "cwd: $(pwd)"
          find data -type f \( -name '*.yaml' -o -name '*.yml' \) | sort

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty - check environment secrets}"
          : "${TF_STATE_SCHEMA:?TF_STATE_SCHEMA is empty - check workflow env}"
          start=$(date +%s)
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
          echo "init took $(( $(date +%s) - start ))s"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s \
            -detailed-exitcode -no-color \
            -out=tfplan
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          if [ -f tfplan ]; then
            terraform show -no-color tfplan > tfplan.txt
            terraform show -json    tfplan > plan.json
          else
            echo "No plan file produced - plan failed before writing output." > tfplan.txt
            echo '{}' > plan.json
          fi

          if [ "$code" = "1" ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          exit 0
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      - name: Extract summary line
        id: summary
        run: |
          line="unknown"
          if [ -f tfplan.txt ]; then
            line="$(grep -E '^(Plan:|No changes)' tfplan.txt | head -1 || echo 'unknown')"
          fi
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          echo "$line"

      # ─────────────── Nexus Dashboard ───────────────
      - name: ND doctor
        if: steps.plan.outputs.exitcode == '2'
        run: nac-analytics nd doctor --output text
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: Pin ND baseline snapshot
        id: baseline
        if: steps.plan.outputs.exitcode == '2'
        run: |
          strategy="${{ github.event.inputs.baseline || 'latest' }}"
          echo "baseline strategy: ${strategy}"

          set +e
          if [ "$strategy" = "analyze" ]; then
            nac-analytics nd analyze --output text > snap.out 2> snap.err
          else
            nac-analytics nd snapshots latest --output text > snap.out 2> snap.err
          fi
          rc=$?
          set -e

          echo "--- CLI diagnostics (stderr) ---"
          cat snap.err || true
          echo "--------------------------------"

          # The snapshot ID is the ONLY thing on stdout.
          # Do NOT read stderr - it contains the analysis JOB id, which is a
          # different identifier and is rejected by prechange/delta.
          snap="$(tail -n1 snap.out | tr -d '[:space:]')"

          if [ -z "$snap" ]; then
            echo "::warning::No baseline snapshot resolved (rc=${rc}); falling back to 'latest'"
          fi
          echo "snapshot_id=${snap}" >> "$GITHUB_OUTPUT"
          echo "baseline snapshot: ${snap:-<none>}"
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: ND pre-change analysis
        id: prechange
        if: steps.plan.outputs.exitcode == '2'
        run: |
          BASELINE="${{ steps.baseline.outputs.snapshot_id }}"
          [ -n "$BASELINE" ] || BASELINE="latest"
          echo "analysing plan.json against baseline: ${BASELINE}"

          # NOTE: --report-file applies to JUnit output only.
          # With --output markdown the report is written to STDOUT.
          set +e
          nac-analytics nd prechange plan.json "$BASELINE" \
            --fail-on "${ND_FAIL_ON}" \
            --detail full \
            --output markdown \
            > prechange.raw 2> prechange.err
          code=$?
          set -e

          echo "--- CLI diagnostics (stderr) ---"
          cat prechange.err || true
          echo "--------------------------------"
          cat prechange.raw || true

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Trim any preamble before the first markdown heading
          sed -n '/^# /,$p' prechange.raw > nd-prechange.md || true
          [ -s nd-prechange.md ] || \
            echo "_No Nexus Dashboard pre-change report produced (exit ${code})._" > nd-prechange.md

          # Pull job_id and the ND UI link out of the markdown table
          job_id="$(awk -F'|' '$2 ~ /^ *job_id *$/ {gsub(/^ +| +$/,"",$3); print $3; exit}' nd-prechange.md)"
          ui_url="$(awk -F'|' '$2 ~ /^ *prechange_ui_url *$/ {gsub(/^ +| +$/,"",$3); print $3; exit}' nd-prechange.md)"
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"
          echo "ui_url=${ui_url}" >> "$GITHUB_OUTPUT"
          echo "job_id: ${job_id:-<none>}"
          echo "ui_url: ${ui_url:-<none>}"

          case "$code" in
            0) echo "ND: completed" ;;
            2) echo "::warning::ND analysis job failed, stopped, or timed out" ;;
            3) echo "::warning::ND found new anomalies at or above the failure threshold" ;;
            4) echo "::error::ND rejected the candidate configuration (bad input)"; exit 1 ;;
            5) echo "::error::ND authentication or authorisation failure"; exit 1 ;;
            *) echo "::error::ND unexpected error (exit $code)"; exit 1 ;;
          esac
          exit 0
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      # Optional: fetch the same completed analysis as JUnit for archival.
      # Uses --job-id so ND does NOT re-run the analysis.
      - name: ND JUnit report
        if: steps.prechange.outputs.job_id != ''
        continue-on-error: true
        run: |
          nac-analytics nd prechange \
            --job-id "${{ steps.prechange.outputs.job_id }}" \
            --fail-on none \
            --output junit \
            --report-file prechange-report.xml
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      # NOTE: the prechange report above already contains a Compliance section
      # with the same figures. This standalone step is redundant - remove it if
      # you want a tighter summary.
      - name: ND compliance
        id: compliance
        if: steps.plan.outputs.exitcode == '2'
        continue-on-error: true
        run: |
          set +e
          nac-analytics nd compliance --output markdown > compliance.raw 2> compliance.err
          set -e
          cat compliance.err || true
          sed -n '/^# /,$p' compliance.raw > nd-compliance.md || true
          [ -s nd-compliance.md ] || echo "_No compliance report produced._" > nd-compliance.md
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      # ───── Summary: ND first, Terraform second ─────
      - name: Build step summary
        if: always()
        run: |
          {
            echo "# ACI Change Analysis"
            echo ''
            echo "**Plan:** ${{ steps.summary.outputs.line }}"
            echo ''

            if [ -s nd-prechange.md ]; then
              echo '## 1. Nexus Dashboard pre-change analysis'
              echo ''
              echo "Baseline snapshot: \`${{ steps.baseline.outputs.snapshot_id || 'latest' }}\`"
              echo ''
              if [ -n "${{ steps.prechange.outputs.ui_url }}" ]; then
                echo '🔗 [Open this analysis in Nexus Dashboard](${{ steps.prechange.outputs.ui_url }})'
                echo ''
              fi
              if [ "${{ env.ND_FAIL_ON }}" = "none" ]; then
                echo 'ℹ️ **REPORT ONLY** — `--fail-on none`, so ND did not gate this change.'
                echo 'The anomaly counts below are informational.'
              else
                case "${{ steps.prechange.outputs.exitcode }}" in
                  0) echo '✅ **PASS** — no new anomalies at or above `${{ env.ND_FAIL_ON }}`' ;;
                  3) echo '⚠️ **FAIL** — new anomalies at or above `${{ env.ND_FAIL_ON }}`' ;;
                  *) echo "❌ ND did not complete (exit ${{ steps.prechange.outputs.exitcode }})" ;;
                esac
              fi
              echo ''
              cat nd-prechange.md
              echo ''
              echo '<details><summary>Standalone fabric compliance</summary>'
              echo ''
              cat nd-compliance.md 2>/dev/null || echo '_none_'
              echo ''
              echo '</details>'
              echo ''
              echo '---'
              echo ''
            fi

            echo '## 2. Terraform plan'
            echo ''
            if [ "${{ steps.plan.outputs.exitcode }}" = "2" ]; then
              echo '⚠️ Changes detected - **Apply to APIC** is waiting for approval.'
            elif [ "${{ steps.plan.outputs.exitcode }}" = "0" ]; then
              echo '✅ No changes. Apply will be skipped.'
            else
              echo '❌ Plan did not complete - see the Plan step logs.'
            fi
            echo ''
            if [ -f tfplan.txt ]; then
              echo '### Resource changes'
              echo '```'
              grep -E '^  # ' tfplan.txt | head -80 || echo '(none)'
              echo '```'
              echo ''
              echo '<details><summary>Full plan output</summary>'
              echo ''
              echo '```hcl'
              head -c 50000 tfplan.txt
              echo '```'
              echo '</details>'
            else
              echo '⚠️ No plan output found.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/tfplan.txt
            ${{ env.WORKING_DIR }}/plan.json
            ${{ env.WORKING_DIR }}/nd-prechange.md
            ${{ env.WORKING_DIR }}/nd-compliance.md
            ${{ env.WORKING_DIR }}/prechange-report.xml
          retention-days: 5
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKING_DIR;
            const read = (f, fallback) => {
              try { return fs.readFileSync(`${dir}/${f}`, 'utf8'); }
              catch { return fallback; }
            };
            let nd   = read('nd-prechange.md', '_No ND report._');
            let plan = read('tfplan.txt', '_No plan output._');
            if (nd.length   > 30000) nd   = nd.slice(0, 30000)   + '\n... truncated';
            if (plan.length > 30000) plan = plan.slice(0, 30000) + '\n... truncated';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## ACI Change Analysis',
                '',
                '`${{ steps.summary.outputs.line }}`',
                '',
                '### 1. Nexus Dashboard pre-change',
                '',
                nd,
                '',
                '### 2. Terraform plan',
                '',
                '<details><summary>Show plan</summary>',
                '',
                '```hcl',
                plan,
                '```',
                '</details>'
              ].join('\n')
            });

  # ══════════════════════════════════════════════════════════
  # JOB 2 — Apply + post-change delta
  # main only, blocks on required reviewers.
  # ══════════════════════════════════════════════════════════
  apply:
    name: Apply to APIC
    needs: plan
    if: |
      needs.plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Approval context
        run: |
          echo "Approved plan : ${{ needs.plan.outputs.summary }}"
          echo "ND baseline   : ${{ needs.plan.outputs.nd_snapshot }}"
          echo "ND prechange  : exit ${{ needs.plan.outputs.nd_exitcode }}"
          echo "ND job id     : ${{ needs.plan.outputs.nd_job_id }}"
          echo "Commit        : ${{ github.sha }}"
          echo "Triggered by  : ${{ github.actor }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"

      - name: Verify tools
        run: |
          terraform version
          nac-analytics version

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty}"
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s tfplan
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      - name: ND post-change delta
        id: delta
        continue-on-error: true
        run: |
          # A fresh snapshot is required here. 'snapshots latest' would race ND's
          # own 2-4h collection cycle and could return the PRE-change state.
          echo "Triggering post-change assurance analysis (this takes several minutes)"
          set +e
          nac-analytics nd analyze --output text > post.out 2> post.err
          set -e
          echo "--- CLI diagnostics (stderr) ---"
          cat post.err || true
          echo "--------------------------------"

          # stdout only - stderr carries the analysis JOB id, not the snapshot id
          POST="$(tail -n1 post.out | tr -d '[:space:]')"
          echo "post snapshot: ${POST:-<none>}"

          PRE="${{ needs.plan.outputs.nd_snapshot }}"
          if [ -z "$PRE" ] || [ -z "$POST" ]; then
            echo "::warning::Missing snapshot ID (pre='${PRE}' post='${POST}') - skipping delta"
            echo "_Delta skipped: missing snapshot ID._" > nd-delta.md
            echo "exitcode=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same as prechange: markdown goes to STDOUT, --report-file is JUnit only
          set +e
          nac-analytics nd delta "$PRE" "$POST" \
            --fail-on "${ND_DELTA_FAIL_ON}" \
            --detail full \
            --output markdown \
            > delta.raw 2> delta.err
          code=$?
          set -e

          echo "--- CLI diagnostics (stderr) ---"
          cat delta.err || true
          echo "--------------------------------"
          cat delta.raw || true

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          sed -n '/^# /,$p' delta.raw > nd-delta.md || true
          [ -s nd-delta.md ] || \
            echo "_No delta report produced (exit ${code})._" > nd-delta.md

          case "$code" in
            0) echo "ND delta: completed" ;;
            2) echo "::warning::ND delta job failed, stopped, or timed out" ;;
            3) echo "::warning::ND delta found new anomalies at or above the threshold" ;;
            4) echo "::error::ND rejected the delta request (bad input)" ;;
            5) echo "::error::ND authentication or authorisation failure" ;;
            *) echo "::warning::ND delta unexpected exit ${code}" ;;
          esac
          exit 0
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: Build step summary
        if: always()
        run: |
          {
            echo '# Applied to APIC'
            echo ''
            echo "Plan applied: **${{ needs.plan.outputs.summary }}**"
            echo ''
            if [ -n "${{ needs.plan.outputs.nd_ui_url }}" ]; then
              echo '🔗 [Pre-change analysis in Nexus Dashboard](${{ needs.plan.outputs.nd_ui_url }})'
              echo ''
            fi
            echo '## Nexus Dashboard post-change delta'
            echo ''
            if [ "${{ env.ND_DELTA_FAIL_ON }}" = "none" ]; then
              echo 'ℹ️ **REPORT ONLY** — `--fail-on none`; counts below are informational.'
            else
              case "${{ steps.delta.outputs.exitcode }}" in
                0)       echo '✅ **PASS** — no new anomalies at or above `${{ env.ND_DELTA_FAIL_ON }}`' ;;
                3)       echo '⚠️ **NEW ANOMALIES** introduced by this change' ;;
                skipped) echo 'ℹ️ Delta skipped - snapshot ID unavailable' ;;
                *)       echo "ℹ️ Delta exit ${{ steps.delta.outputs.exitcode }}" ;;
              esac
            fi
            echo ''
            cat nd-delta.md 2>/dev/null || echo '_none_'
            echo ''
            echo '## Terraform outputs'
            echo '```json'
            terraform output -json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Upload ND delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nd-delta
          path: |
            ${{ env.WORKING_DIR }}/nd-delta.md
            ${{ env.WORKING_DIR }}/delta.raw
          retention-days: 5
          if-no-files-found: warn