name: Terraform ACI

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.yaml'
      - '.github/workflows/terraform-aci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.yaml'
      - '.github/workflows/terraform-aci.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]

# Never let two applies race the same state
concurrency:
  group: terraform-aci
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  TF_VERSION: '1.15.9'
  TF_VAR_FILE: environments/dev.tfvars

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Validate & Plan
    runs-on: [self-hosted, openshift, aci]
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=aci_dev"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=120s \
            -var-file="${TF_VAR_FILE}" \
            -detailed-exitcode \
            -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > tfplan.txt
        env:
          TF_VAR_aci_url:      ${{ secrets.ACI_URL }}
          TF_VAR_aci_username: ${{ secrets.ACI_USERNAME }}
          TF_VAR_aci_password: ${{ secrets.ACI_PASSWORD }}

      - name: Plan summary
        run: |
          {
            echo "### Terraform Plan"
            echo '```hcl'
            grep -E '^(Plan:|No changes|  [~+-])' tfplan.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            tfplan.txt
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.txt', 'utf8');
            const body = [
              '#### Terraform Plan',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... truncated' : plan,
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

