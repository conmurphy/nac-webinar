name: NetAsCode ACI Terraform Pipeline

on:
  # Every commit on a PR branch: validate + plan, never apply. The default
  # types (opened, synchronize, reopened) mean 'synchronize' re-runs this on
  # each push to the branch, so there is no need for a feature-branch push
  # trigger as well.
  #
  # NO paths filter here on purpose. If this workflow is a required status
  # check and a PR touches only files outside the filter, the check never
  # reports and the PR can never merge. Validation is seconds and a plan is
  # about a minute - cheap insurance against a permanently-pending PR.
  pull_request:
    branches: [main]

  # A push to main is a merged PR. This is the only path to apply.
  push:
    branches: [main]
    paths:
      - 'aci-config/**'
      - 'tests-and-validations/**'
      - '.github/workflows/terraform-aci.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan          # validate + plan only
          - apply         # validate + plan + apply + test
          - test          # post-deploy tests ONLY, against the fabric as it is
      include_tags:
        description: 'test only: Robot tag expression, e.g. ucs-domain or fabric-icmp. Blank runs the full change-verification set.'
        required: false
        default: ''
        type: string
      changed_subnets:
        description: 'test only: comma-separated subnet CIDRs to scope ICMP tests to. Blank runs a full sweep.'
        required: false
        default: ''
        type: string

# Plan runs are per-ref and cancellable: a newer commit supersedes an in-flight
# plan for the same PR. Merges to main share one group and are never cancelled,
# so an apply can never be interrupted half way through.
#
# Note both still contend for the Terraform state lock; -lock-timeout=300s makes
# them queue rather than fail.
concurrency:
  group: terraform-aci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ---- Terraform ----
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'
  TF_INPUT: '0'
  WORKING_DIR: aci-config
  TF_STATE_SCHEMA: aci_nac
  TF_DATA_DIR: /home/runner/_work/_tfdata/aci-config
  TF_PLUGIN_CACHE_DIR: /home/runner/_work/_tfcache
  # ---- nac-validate ----
  # Two tiers. local-rules is what the pre-commit hook runs on a laptop:
  # self-consistency checks with a zero false-positive budget. pipeline-rules
  # adds organisational policy (allocations, segmentation, metadata,
  # referential integrity).
  #
  # The pipeline runs BOTH. Passing only pipeline-rules would silently stop
  # gating prod on every local-tier rule.
  NAC_VALIDATE_DIR: tests-and-validations/01-pre-deploy-validation-rules
  NAC_VALIDATE_LOCAL_RULES: tests-and-validations/01-pre-deploy-validation-rules/rules/local-rules
  NAC_VALIDATE_PIPELINE_RULES: tests-and-validations/01-pre-deploy-validation-rules/rules/pipeline-rules
  NAC_VALIDATE_SCHEMA: tests-and-validations/01-pre-deploy-validation-rules/schemas/apic_schema.yaml
  # ---- nac-test ----
  NAC_TEST_DIR: tests-and-validations/02-post-deploy-tests
  NAC_TEST_TEMPLATES: tests-and-validations/02-post-deploy-tests/tests/templates
  NAC_TEST_FILTERS: tests-and-validations/02-post-deploy-tests/tests/filters
  NAC_TEST_DEFAULTS: tests-and-validations/02-post-deploy-tests/tests/defaults
  # Ensure SSH and other tools find a writable home. Observed under oc exec that
  # HOME can resolve to '/', producing "Could not create directory '/.ssh'".
  HOME: /home/runner

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 0 — Workflow lint (independent)
  # ══════════════════════════════════════════════════════════
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes via the checkout credentials - the gh-pages
          # deploy uses its own github_token input. Self-hosted runners keep
          # the workspace, so don't leave a token in .git/config.
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -shellcheck=shellcheck
      - name: zizmor
        env:
          # Enables online audits (stale action versions, ref existence).
          # Without this zizmor warns and runs in offline mode.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor
          zizmor --min-severity=high .github/workflows/

  # ══════════════════════════════════════════════════════════
  # JOB 1 — Validate data model (fast gate, no fabric access)
  #
  # Runs the SAME rules as the local pre-commit hook, plus the repo-wide rules
  # that need every file at once (subnet uniqueness, overlap, referential
  # integrity). Deliberately has no APIC or ND credentials: this job answers
  # "is the intent correct?", not "what will change?".
  # ══════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════
  # JOB 1 — Validate data model (fast gate, no fabric access)
  #
  # Runs BOTH tiers: local-rules (what the pre-commit hook runs - self
  # consistency, zero false-positive budget) plus pipeline-rules
  # (organisational policy: allocations, segmentation, metadata, referential
  # integrity). Passing only pipeline-rules would silently stop gating prod on
  # every local-tier rule.
  #
  # Deliberately has no APIC or ND credentials: this job answers "is the intent
  # correct?", not "what will change?".
  # ══════════════════════════════════════════════════════════
  validate:
    name: Validate data model
    # A test-only dispatch verifies the fabric as it stands - there is no
    # proposed change to validate, so skip straight to the test job.
    if: "!(github.event_name == 'workflow_dispatch' && inputs.action == 'test')"
    runs-on: [self-hosted, openshift, aci]
    permissions:
      contents: read
    outputs:
      exitcode: ${{ steps.validate.outputs.exitcode }}
      high:     ${{ steps.validate.outputs.high }}
      medium:   ${{ steps.validate.outputs.medium }}
      low:      ${{ steps.validate.outputs.low }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tools and rule discovery
        run: |
          python3 --version
          command -v nac-validate || { echo "::error::nac-validate not on PATH"; exit 1; }

          # Fail here rather than inside the validate step: an empty rule
          # directory makes nac-validate exit 0, which looks identical to a pass.
          for d in "${NAC_VALIDATE_LOCAL_RULES}" "${NAC_VALIDATE_PIPELINE_RULES}"; do
            if [ ! -d "$d" ]; then
              echo "::error::rule directory not found: $d"
              exit 1
            fi
            n=$(find "$d" -maxdepth 1 -name '*.py' | wc -l)
            echo "$d  ($n rule file(s))"
            find "$d" -maxdepth 1 -name '*.py' -printf '    %f\n' | sort
            if [ "$n" = "0" ]; then
              echo "::error::no rule files in $d - validation would pass vacuously"
              exit 1
            fi
          done

      - name: Show data model files
        run: |
          find "${WORKING_DIR}/data" -type f \( -name '*.yaml' -o -name '*.yml' \) \
            | sort | sed 's|^|  |'
      
      # Jinja-level check. Fast, per-file, and annotates the PR diff with a line
      # number. Also runs a heuristic lint for the whitespace-join defect, which
      # the Robot dry run below CANNOT see: a joined line is often still a valid
      # keyword call with an extra argument, so it resolves cleanly and fails only
      # at execution time.
      - name: Check nac-test templates render
        run: |
          {
            NT="$(command -v nac-test || true)"
            PY="$(head -1 "$NT" 2>/dev/null | sed 's|^#!||' | awk '{print $1}')"
            if [ ! -x "${PY:-}" ]; then
              echo "::warning::could not resolve nac-test's interpreter - skipping the template parse check"
              exit 0
            fi
            echo "using ${PY}"
            "$PY" "${GITHUB_WORKSPACE}/.github/scripts/check_templates.py" \
              "${NAC_TEST_TEMPLATES}" \
              --lint
          }

      # Robot-level check. --dry-run renders the templates and then resolves every
      # keyword and argument count WITHOUT executing anything, so it catches the
      # class the Jinja check cannot: a keyword that does not exist, or is called
      # with the wrong number of arguments.
      - name: Dry-run nac-test suites
        run: |
          {
            set +e
            nac-test \
              -d "${WORKING_DIR}/data" \
              -d "${NAC_TEST_DEFAULTS}" \
              -t "${NAC_TEST_TEMPLATES}" \
              -f "${NAC_TEST_FILTERS}" \
              -o nac-test-dryrun \
              --dry-run \
              > dryrun.out 2> dryrun.err
            code=$?
            set -e

            cat dryrun.out || true
            cat dryrun.err || true

            # Belt and braces: a non-zero exit is the primary signal, but grep the
            # combined output for the two failure texts that matter most, in case
            # a future version reports them without failing.
            cat dryrun.out dryrun.err > dryrun-all.txt 2>/dev/null || true
            if grep -qiE "no keyword with name|keyword .* expected .* argument" dryrun-all.txt; then
              echo "::error::a test references a keyword that does not exist, or calls one with the wrong arguments. Every test in that suite would fail at execution time with a message that looks like a fabric finding."
              exit 1
            fi

            if [ "$code" != "0" ]; then
              echo "::error::nac-test --dry-run exited ${code} - the post-deploy suite would not execute correctly. Fix this before the change reaches the fabric."
              exit "$code"
            fi
            echo "all suites resolve: templates render and every keyword exists"
          }

      # Two passes over the same rules: text for the job log (readable, keeps
      # the rich rule context) and JSON for the step summary. Rules are pure
      # in-memory work, so the second pass costs nothing and means a malformed
      # JSON writer can never hide a finding.
      - name: nac-validate
        id: validate
        run: |
          SCHEMA_ARG=()
          if [ -f "${NAC_VALIDATE_SCHEMA}" ]; then
            SCHEMA_ARG=(-s "${NAC_VALIDATE_SCHEMA}")
            echo "schema: ${NAC_VALIDATE_SCHEMA}"
          else
            echo "::warning::schema not found at ${NAC_VALIDATE_SCHEMA} - running rules only"
          fi

          RULE_ARGS=(-r "${NAC_VALIDATE_LOCAL_RULES}" -r "${NAC_VALIDATE_PIPELINE_RULES}")

          set +e
          nac-validate "${SCHEMA_ARG[@]}" "${RULE_ARGS[@]}" \
            --no-color \
            "${WORKING_DIR}/data" \
            > validate.out 2> validate.err
          code=$?
          nac-validate "${SCHEMA_ARG[@]}" "${RULE_ARGS[@]}" \
            --format json \
            "${WORKING_DIR}/data" \
            > validate.json 2> validate-json.err
          json_code=$?
          set -e

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          echo '--- nac-validate (text) ---'
          cat validate.out || true
          cat validate.err || true
          cat validate.out validate.err > validate-all.txt 2>/dev/null || true

          if [ "$json_code" != "$code" ]; then
            echo "::warning::text run exited ${code} but JSON run exited ${json_code} - results may be inconsistent"
          fi
          if ! python3 -c "import json,sys; json.load(open('validate.json'))" 2>/dev/null; then
            echo "::warning::validate.json is not valid JSON - the summary will fall back to the raw log"
            echo '{}' > validate.json
          fi

          # A rule that raises did not evaluate. For a segmentation rule that is
          # indistinguishable from a pass, so surface it loudly.
          if grep -q 'Traceback (most recent call last)' validate-all.txt; then
            echo "::error::a rule raised an exception - it did NOT evaluate. Treat this as a failure, not a pass."
          fi

          # Severity counts for downstream jobs. Every violation blocks
          # regardless of severity; these are for reporting only.
          sev_count() {
            awk -v want="$1" '
              {
                line = $0
                while (match(line, /[0-9]+ [A-Z]+ severity/)) {
                  chunk = substr(line, RSTART, RLENGTH)
                  split(chunk, f, " ")
                  if (f[2] == want) total += f[1]
                  line = substr(line, RSTART + RLENGTH)
                }
              }
              END { print total + 0 }
            ' validate-all.txt
          }
          {
            echo "high=$(sev_count HIGH)"
            echo "medium=$(sev_count MEDIUM)"
            echo "low=$(sev_count LOW)"
          } >> "$GITHUB_OUTPUT"

          case "$code" in
            0) echo "validation passed" ;;
            1) echo "::error::Data model validation failed - business rule violations. See the summary for the cause and fix." ;;
            2) echo "::error::YAML syntax or schema validation failed - semantic rules did not run." ;;
            3) echo "::error::nac-validate configuration error (missing schema or invalid rules) - NOTHING was validated." ;;
            *) echo "::error::nac-validate exited ${code} (unexpected)" ;;
          esac
          exit "$code"

      - name: Build validation summary
        if: always()
        env:
          EXITCODE: ${{ steps.validate.outputs.exitcode }}
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/validate_summary.py" \
            validate.json \
            --rules "${NAC_VALIDATE_LOCAL_RULES}" \
            --rules "${NAC_VALIDATE_PIPELINE_RULES}" \
            --exitcode "${EXITCODE:-1}" \
            > validate-summary.md

          cat validate-summary.md >> "$GITHUB_STEP_SUMMARY"

          # Raw output stays available but collapsed, below the styled detail.
          if [ -s validate-all.txt ]; then
            {
              echo ''
              echo '<details><summary>Raw nac-validate output</summary>'
              echo ''
              echo '```text'
              head -c 40000 validate-all.txt
              echo ''
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

    

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nac-validate
          path: |
            validate.out
            validate.err
            validate.json
            validate-all.txt
            validate-summary.md
            dryrun.out
            dryrun.err
            dryrun-all.txt
          retention-days: 5
          if-no-files-found: warn


# ══════════════════════════════════════════════════════════
  # JOB 2 — Terraform plan
  # Only runs once validation passes.
  #
  # NFS NOTE: every multi-line step body below is wrapped in a single compound
  # command `{ ... }`. bash reads a script FILE lazily, one command at a time.
  # The step script lives in RUNNER_TEMP, which on this runner is NFS-backed, so
  # a long step leaves a window for the file handle to go stale - bash then dies
  # with "error reading input file: Stale file handle" AFTER the command it was
  # running has already succeeded. Wrapping forces bash to parse to the closing
  # brace before executing anything, so the whole script is read while the handle
  # is still valid.
  # ══════════════════════════════════════════════════════════
  plan:
    name: Terraform Plan
    needs: validate
    if: "!(github.event_name == 'workflow_dispatch' && inputs.action == 'test')"
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto-plan
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      exitcode:        ${{ steps.plan.outputs.exitcode }}
      summary:         ${{ steps.summary.outputs.line }}
      changed_subnets: ${{ steps.changed.outputs.subnets }}
      changed_bds:     ${{ steps.changed.outputs.bds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare cache dirs
        run: |
          {
            mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"
            if [ -d "$TF_DATA_DIR/modules" ]; then
              echo "module cache: WARM"
            else
              echo "module cache: COLD - first init will be slow"
            fi
          }

      - name: Verify tools
        run: |
          {
            terraform version
            jq --version
          }

      - name: Init
        run: |
          {
            : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty - check environment secrets}"
            : "${TF_STATE_SCHEMA:?TF_STATE_SCHEMA is empty - check workflow env}"
            start=$(date +%s)
            terraform init -input=false -reconfigure \
              -backend-config="conn_str=${TF_STATE_CONN_STR}" \
              -backend-config="schema_name=${TF_STATE_SCHEMA}"
            echo "init took $(( $(date +%s) - start ))s"
          }
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Validate
        run: terraform validate

      # Deliberately minimal: a four-line body is read by bash in a single
      # read() call, so there is no later read that can hit NFS ESTALE while
      # terraform is running. All post-processing lives in separate steps.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s -detailed-exitcode -no-color -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      # Separate step so a stale-handle failure during the long plan cannot take
      # the plan rendering with it. Runs even when the plan failed, so tfplan.txt
      # always exists for the PR comment.
      - name: Render plan
        if: always()
        run: |
          {
            if [ -f tfplan ]; then
              terraform show -no-color tfplan > tfplan.txt
              terraform show -json    tfplan > plan.json
            else
              echo "No plan file produced - plan failed before writing output." > tfplan.txt
              echo '{}' > plan.json
            fi
            wc -l tfplan.txt
            wc -c plan.json
          }

      - name: Check plan result
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            case "${PLAN_EXITCODE:-}" in
              0) echo "no changes" ;;
              2) echo "changes detected" ;;
              1) echo "::error::terraform plan failed"; exit 1 ;;
              "") echo "::error::plan exit code was not captured - the step was interrupted before it could record one. This is a runner/filesystem fault, not a configuration fault. Re-run the job."
                  exit 1 ;;
              *) echo "::error::terraform plan exited ${PLAN_EXITCODE} (unexpected)"; exit 1 ;;
            esac
          }

      - name: Extract summary line
        id: summary
        if: always()
        run: |
          {
            line=""
            if [ -f tfplan.txt ]; then
              # `|| true` on grep, not on the pipeline - head always exits 0, so a
              # trailing `|| echo unknown` on the pipe is dead code.
              line="$(grep -E '^(Plan:|No changes)' tfplan.txt || true)"
              line="$(printf '%s\n' "$line" | head -1)"
            fi
            [ -n "$line" ] || line="unknown"

            # Delimiter form: safe for arbitrary text, including newlines.
            {
              echo 'line<<__TF_SUMMARY__'
              printf '%s\n' "$line"
              echo '__TF_SUMMARY__'
            } >> "$GITHUB_OUTPUT"
            echo "$line"
          }

      - name: Build plan change table
        id: plantable
        if: always()
        run: |
          {
            if [ -f plan.json ]; then
              python3 "${GITHUB_WORKSPACE}/.github/scripts/plan_summary.py" \
                plan.json > plan-summary.md
            else
              echo "_No plan JSON produced._" > plan-summary.md
            fi
            head -40 plan-summary.md
          }

      # ─────────── Change scoping for post-deploy tests ───────────
      # The YAML data model is declarative and has no notion of "new". plan.json
      # is the only place in this pipeline that knows what changed, so the subnet
      # list is extracted here and handed to nac-test at runtime via
      # CHANGED_SUBNETS. An empty list means the suite runs a full sweep.
      #
      # Only SUBNETS are scoped. Static path tests are deliberately NOT scoped:
      # they are 13 sub-second API calls, so a full sweep costs nothing and
      # reports stronger coverage than "2 verified, 11 skipped".
      - name: Extract changed subnets for post-deploy tests
        id: changed
        if: always()
        run: |
          {
            if [ ! -f plan.json ]; then
              echo "subnets=" >> "$GITHUB_OUTPUT"
              echo "bds=" >> "$GITHUB_OUTPUT"
              echo "no plan.json - post-deploy tests will run a full sweep"
              exit 0
            fi

            # fvSubnet objects being created or updated.
            #
            # NO REGEX and no backslash escapes. jq string literals accept only
            # JSON escapes, so a pattern containing "\[" aborts the program - and
            # with stderr suppressed that failure is invisible, silently yielding
            # an empty list and a permanent full sweep. split()/ltrimstr()/
            # rtrimstr() achieve the same parse using characters that cannot be
            # mangled by copy/paste.
            #
            # Example dn:
            #   uni/tn-emea-cto/BD-198.18.215.0_26/subnet-[198.18.215.1/26]
            if ! jq -r '
              .resource_changes[]
              | select((.change.actions // []) | any(. == "create" or . == "update"))
              | (.change.after // {}) as $a
              | select(($a.class_name // "") == "fvSubnet")
              | ($a.dn // "") as $dn
              | if ($dn | contains("/BD-")) and ($dn | contains("/subnet-")) then
                  ( ($dn | split("/BD-") | .[1] | split("/") | .[0]) as $bd
                  | ($dn | split("/subnet-") | .[1] | ltrimstr("[") | rtrimstr("]")) as $ip
                  | "\($bd)\t\($ip)" )
                elif (($a.content.ip // "") != "") then
                  "unknown\t\($a.content.ip)"
                else
                  empty
                end
            ' plan.json > changed-subnets.tsv; then
              echo "::warning::fvSubnet extraction failed - post-deploy tests will run a full sweep"
              : > changed-subnets.tsv
            fi

            SUBNETS="$(cut -f2 changed-subnets.tsv | paste -sd, - || true)"
            BDS="$(cut -f1 changed-subnets.tsv | sort -u | paste -sd, - || true)"

            echo "subnets=${SUBNETS}" >> "$GITHUB_OUTPUT"
            echo "bds=${BDS}"         >> "$GITHUB_OUTPUT"
            echo "changed subnets: ${SUBNETS:-<none - tests will run a full sweep>}"
            echo "changed BDs    : ${BDS:-<none>}"
            echo '--- changed-subnets.tsv ---'
            cat changed-subnets.tsv || true
          }

      - name: Build step summary
        if: always()
        shell: bash
        env:
          PLAN_LINE:     ${{ steps.summary.outputs.line }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          SCOPE:         ${{ steps.changed.outputs.subnets }}
        run: |
          {
            set -uo pipefail
            {
              echo '# 2. Terraform plan'
              echo ''
              echo "**Plan:** ${PLAN_LINE:-unknown}"
              echo ''
              case "${PLAN_EXITCODE:-}" in
                2) echo '⚠️ Changes detected - **Apply to APIC** is waiting for approval.' ;;
                0) echo '✅ No changes. Apply will be skipped.' ;;
                '') echo '❌ Plan was interrupted before recording a result - re-run the job.' ;;
                *) echo '❌ Plan did not complete - see the Plan step logs.' ;;
              esac
              echo ''
              cat plan-summary.md 2>/dev/null || echo '_No summary._'
              echo ''
              echo "**Post-deploy test scope:** \`${SCOPE:-all configured subnets (full sweep)}\`"
              echo ''
              echo '<details><summary>Raw terraform plan output</summary>'
              echo ''
              echo '```hcl'
              head -c 50000 tfplan.txt 2>/dev/null || echo '(no plan output)'
              echo ''
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/tfplan.txt
            ${{ env.WORKING_DIR }}/plan.json
            ${{ env.WORKING_DIR }}/plan-summary.md
            ${{ env.WORKING_DIR }}/changed-subnets.tsv
          retention-days: 5
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════
  # JOB 3 — PR report
  #
  # One sticky comment covering validation and plan, edited in place on every
  # commit rather than appended. Owns all PR commenting, so validate and plan
  # stay on contents:read.
  #
  # Body generation lives in .github/scripts/pr_comment.py; the github-script
  # step only performs the upsert. Keeps shell-continuation backslashes out of
  # the YAML -> JavaScript boundary, which is where they break.
  # ══════════════════════════════════════════════════════════
  report:
    name: PR report
    needs: [validate, plan]
    # always(): a validation failure skips the plan job entirely, and that is
    # exactly when the reviewer most needs this comment.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # MUST come before the artifact downloads. actions/checkout cleans the
      # workspace by default, so checking out afterwards would delete them.
      # Sparse checkout because only the renderer is needed here.
      - name: Checkout report script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # continue-on-error: the artifact will not exist when its job was skipped
      # or failed before uploading. The report degrades instead of failing.
      - name: Download validation report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nac-validate
          path: reports/validate

      - name: Download plan report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: reports/plan

      - name: Show what was downloaded
        run: |
          echo '--- script ---'
          ls -l .github/scripts/ || echo "(script missing)"
          echo '--- artifacts ---'
          find reports -type f 2>/dev/null | sort || echo "(none)"

      - name: Render PR comment
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PLAN_RESULT:     ${{ needs.plan.result }}
          PLAN_EXITCODE:   ${{ needs.plan.outputs.exitcode }}
          PLAN_SUMMARY:    ${{ needs.plan.outputs.summary }}
          VAL_HIGH:        ${{ needs.validate.outputs.high }}
          VAL_MEDIUM:      ${{ needs.validate.outputs.medium }}
          VAL_LOW:         ${{ needs.validate.outputs.low }}
          SCOPE:           ${{ needs.plan.outputs.changed_subnets }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # On a pull_request event github.sha is the ephemeral merge commit,
          # which is not in the branch history and means nothing to a reviewer.
          HEAD_SHA:        ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/pr_comment.py \
            --validate-dir reports/validate \
            --plan-dir reports/plan \
            > pr-comment.md
          echo "--- first 40 lines ---"
          head -40 pr-comment.md

      - name: Post or update PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Must match --marker in pr_comment.py. The hidden HTML comment is
            // how this run finds the comment left by the previous one; without
            // it a ten-commit PR accumulates ten near-identical comments.
            const MARKER = '<!-- aci-nac-report -->';

            let body;
            try {
              body = fs.readFileSync('pr-comment.md', 'utf8');
            } catch (err) {
              body = `${MARKER}\n# ACI Network as Code — change review\n\n` +
                `⚠️ The report renderer failed (\`${err.message}\`). ` +
                `See the [run](${process.env.RUN_URL || ''}) for job results.`;
            }
            if (!body.includes(MARKER)) {
              body = `${MARKER}\n${body}`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`updated comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              core.info(`created comment ${created.id}`);
            }

      - name: Upload rendered comment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment
          path: pr-comment.md
          retention-days: 5
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  # JOB 4 — Apply to APIC
  # main only, blocks on required reviewers.
  #
  # Post-deploy verification is a SEPARATE job (see 'test' below) so it can be
  # run standalone via workflow_dispatch without pushing a config change purely
  # to trigger it. This job now does one thing: change the fabric.
  # ══════════════════════════════════════════════════════════
  apply:
    name: Apply to APIC
    needs: [validate, plan]
    if: |
      needs.validate.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      applied: ${{ steps.tfapply.outcome }}
    steps:
      - name: Approval context
        env:
          PLAN_SUMMARY:  ${{ needs.plan.outputs.summary }}
          VAL_LOW:       ${{ needs.validate.outputs.low }}
          SCOPE:         ${{ needs.plan.outputs.changed_subnets }}
          COMMIT_SHA:    ${{ github.sha }}
          TRIGGERED_BY:  ${{ github.actor }}
        run: |
          {
            echo "Approved plan     : ${PLAN_SUMMARY:-unknown}"
            echo "Validation        : passed (${VAL_LOW:-0} LOW findings)"
            echo "Post-deploy scope : ${SCOPE:-full sweep}"
            echo "Commit            : ${COMMIT_SHA}"
            echo "Triggered by      : ${TRIGGERED_BY}"
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare cache dirs
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"

      - name: Verify tools
        run: terraform version

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      # The plan file is binary and tied to the provider versions and state
      # serial from the plan job. A truncated or missing download would make
      # apply fail in a confusing way, so check before touching the fabric.
      - name: Verify plan artifact
        run: |
          {
            if [ ! -s tfplan ]; then
              echo "::error::tfplan is missing or empty - the plan artifact did not download. Re-run the plan job."
              exit 1
            fi
            ls -l tfplan tfplan.txt plan.json
            grep -E '^(Plan:|No changes)' tfplan.txt || true
          }

      - name: Init
        run: |
          {
            : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty}"
            terraform init -input=false -reconfigure \
              -backend-config="conn_str=${TF_STATE_CONN_STR}" \
              -backend-config="schema_name=${TF_STATE_SCHEMA}"
          }
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      # Single command, deliberately. A one-line body is read by bash in one
      # read() syscall, so there is no second read to hit NFS ESTALE part way
      # through the longest and least-recoverable operation in the workflow.
      - name: Apply
        id: tfapply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s tfplan
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      # Cheap, and catches the case where the data model shifted between plan and
      # apply. Advisory only - the change is already on the fabric by this point,
      # so failing the job here would be theatre.
      - name: nac-validate (post-apply intent re-check)
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          {
            SCHEMA_ARG=()
            [ -f "${NAC_VALIDATE_SCHEMA}" ] && SCHEMA_ARG=(-s "${NAC_VALIDATE_SCHEMA}")

            set +e
            nac-validate \
              "${SCHEMA_ARG[@]}" \
              -r "${NAC_VALIDATE_LOCAL_RULES}" \
              -r "${NAC_VALIDATE_PIPELINE_RULES}" \
              "${WORKING_DIR}/data"
            code=$?
            set -e
            if [ "$code" != "0" ]; then
              echo "::warning::post-apply validation returned ${code} - the data model changed between plan and apply"
            else
              echo "post-apply validation: data model still valid"
            fi
            exit 0
          }

      - name: Build step summary
        if: always()
        working-directory: .
        shell: bash
        env:
          APPLY_RESULT: ${{ steps.tfapply.outcome }}
          PLAN_SUMMARY: ${{ needs.plan.outputs.summary }}
          VAL_LOW:      ${{ needs.validate.outputs.low }}
        run: |
          {
            set -uo pipefail
            {
              if [ "${APPLY_RESULT:-}" = "success" ]; then
                echo '# 3. Applied to APIC'
                echo ''
                echo "Plan applied: **${PLAN_SUMMARY:-unknown}**"
              else
                echo '# 3. Apply to APIC did not complete'
                echo ''
                echo "⚠️ The terraform apply step reported \`${APPLY_RESULT:-unknown}\`. The fabric may be partially changed - review the apply logs before re-running."
              fi
              echo ''
              echo "Pre-deploy validation: passed (${VAL_LOW:-0} LOW findings)"
              echo ''
              echo 'Post-deploy verification runs in the **Post-deploy tests** job.'
            } >> "$GITHUB_STEP_SUMMARY"
          }
  # ══════════════════════════════════════════════════════════
  # JOB 5 — Post-deploy operational verification
  #
  # Runs in two situations:
  #   1. automatically after a successful apply
  #   2. standalone, via workflow_dispatch with action=test
  #
  # Standalone matters: verifying the fabric should never require pushing a
  # config change purely to trigger a deployment. These tests are read-only
  # (API GETs and iping over SSH), so re-running them costs nothing and tells
  # you the current state rather than the state at last deploy.
  #
  # ENVIRONMENT: uses aci-tenant-emea-cto-test, which has the APIC and switch
  # credentials but NO deployment protection rules. Pointing this at the apply
  # environment would make every test run wait for approval - including the run
  # immediately after an apply that was already approved.
  # ══════════════════════════════════════════════════════════
  test:
    name: Post-deploy tests
    needs: [validate, plan, apply]
    # always() is required: on a test-only dispatch every upstream job is
    # skipped, and a skipped dependency would otherwise skip this job too.
    if: |
      always() &&
      (needs.apply.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'test'))
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto-test
    # contents: write for the gh-pages push.
    permissions:
      contents: write
    steps:
      - name: Run context
        env:
          TRIGGER:       ${{ github.event_name }}
          ACTION:        ${{ inputs.action }}
          APPLY_RESULT:  ${{ needs.apply.result }}
          PLAN_SCOPE:    ${{ needs.plan.outputs.changed_subnets }}
          INPUT_SCOPE:   ${{ inputs.changed_subnets }}
          INCLUDE_TAGS:  ${{ inputs.include_tags }}
        run: |
          {
            if [ "${APPLY_RESULT}" = "success" ]; then
              echo "mode        : post-apply verification"
            else
              echo "mode        : standalone (verifying the fabric as it stands)"
            fi
            echo "trigger     : ${TRIGGER} ${ACTION:+action=${ACTION}}"
            echo "plan scope  : ${PLAN_SCOPE:-<none>}"
            echo "input scope : ${INPUT_SCOPE:-<none>}"
            echo "tag filter  : ${INCLUDE_TAGS:-<none - full change-verification set>}"
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The connectivity suite needs SSHLibrary (which pulls paramiko) and dig.
      # Probe the interpreter that actually runs Robot, not system python3 - they
      # differ, and checking the wrong one produces a misleading warning.
      - name: Verify nac-test dependencies
        continue-on-error: true
        run: |
          {
            NT="$(command -v nac-test || true)"
            PY="$(head -1 "$NT" 2>/dev/null | sed 's|^#!||' | awk '{print $1}')"
            echo "nac-test       : ${NT:-<not found>}"
            echo "its interpreter: ${PY:-<unknown>}"
            if [ -x "$PY" ]; then
              "$PY" -c "import SSHLibrary, paramiko; print('SSHLibrary', SSHLibrary.__version__, '/ paramiko', paramiko.__version__)" \
                || echo "::warning::SSHLibrary/paramiko missing from the Robot interpreter - fabric iping tests will fail to load"
            else
              echo "::warning::could not resolve nac-test's interpreter - skipping import check"
            fi
            command -v dig  >/dev/null && dig -v 2>&1 | head -1 || echo "::warning::dig is missing - resolver tests will skip"
            command -v ping >/dev/null && echo "ping: present"   || echo "::warning::ping is missing - client gateway tests will skip"
          }

      # SWITCH_USER / SWITCH_PASSWORD / NODE_MGMT_MAP / CHANGED_SUBNETS are
      # passed as ENVIRONMENT variables, not via --variable: nac-test rejects
      # --variable ("No such option", exit 2), and the environment keeps the
      # password out of any command line readable via /proc.
      #
      # --processes 2 caps the SSH fan-out. ACI leaves limit concurrent sessions
      # per user, and exceeding it produces failures that look like fabric faults.
      - name: nac-test - change verification
        id: nactest
        continue-on-error: true
        env:
          ACI_URL:         ${{ secrets.APIC_URL }}
          ACI_USERNAME:    ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD:    ${{ secrets.APIC_PASSWORD }}
          SWITCH_USER:     ${{ secrets.SWITCH_USER }}
          SWITCH_PASSWORD: ${{ secrets.SWITCH_PASSWORD }}
          NODE_MGMT_MAP:   ${{ vars.NODE_MGMT_MAP }}
          # A dispatch input wins over the plan output, so a standalone run can
          # be scoped by hand. Both empty means a full sweep.
          CHANGED_SUBNETS: ${{ inputs.changed_subnets || needs.plan.outputs.changed_subnets }}
          INCLUDE_TAGS:    ${{ inputs.include_tags }}
          PYTHONWARNINGS:  'ignore:Unverified HTTPS request'
        run: |
          {
            echo "node map    : ${NODE_MGMT_MAP:-<EMPTY - fabric tests will skip>}"
            echo "ICMP scope  : ${CHANGED_SUBNETS:-<full sweep>}"
            [ -n "$SWITCH_USER" ] && echo "SWITCH_USER : set" \
              || echo "::warning::SWITCH_USER is empty - fabric iping tests will skip"
            [ -n "$NODE_MGMT_MAP" ] \
              || echo "::warning::NODE_MGMT_MAP repo variable is not set - every fabric iping test will SKIP"

            # A tag filter REPLACES the default exclusion rather than adding to
            # it: asking for --include ucs-domain and silently also excluding
            # baseline would quietly drop tests the operator explicitly asked for.
            if [ -n "${INCLUDE_TAGS}" ]; then
              TAG_ARGS=(--include "${INCLUDE_TAGS}")
              echo "tag filter  : --include ${INCLUDE_TAGS}"
            else
              TAG_ARGS=(--exclude baseline)
              echo "tag filter  : --exclude baseline (default)"
            fi

            set +e
            nac-test \
              -d "${WORKING_DIR}/data" \
              -d "${NAC_TEST_DEFAULTS}" \
              -t "${NAC_TEST_TEMPLATES}" \
              -f "${NAC_TEST_FILTERS}" \
              -o nac-test-results \
              "${TAG_ARGS[@]}" \
              --processes 2 \
              --minimal-reports
            code=$?
            set -e
            echo "exitcode=$code" >> "$GITHUB_OUTPUT"

            # Parse real per-test results from output.xml. Skipped tests are
            # neither passed nor failed - count them so the summary can state how
            # much was actually verified rather than implying full coverage.
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET, sys
          try:
              t = ET.parse('nac-test-results/robot_results/output.xml')
          except Exception:
              print("total=0"); print("passed=0"); print("failed=0"); print("skipped=0")
              sys.exit(0)
          tests = list(t.iter('test'))
          def n(s):
              return sum(1 for x in tests if x.find('status').get('status') == s)
          print(f"total={len(tests)}")
          print(f"passed={n('PASS')}")
          print(f"failed={n('FAIL')}")
          print(f"skipped={n('SKIP')}")
          PY

            echo "nac-test exit ${code}"
            exit 0
          }

      # Skipped when a tag filter is set: the operator asked for a specific
      # subset, and a full baseline sweep alongside it would triple the runtime
      # of what was meant to be a quick targeted check.
      - name: nac-test - fabric baseline (informational)
        id: nactest_baseline
        if: inputs.include_tags == ''
        continue-on-error: true
        env:
          ACI_URL:         ${{ secrets.APIC_URL }}
          ACI_USERNAME:    ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD:    ${{ secrets.APIC_PASSWORD }}
          SWITCH_USER:     ${{ secrets.SWITCH_USER }}
          SWITCH_PASSWORD: ${{ secrets.SWITCH_PASSWORD }}
          NODE_MGMT_MAP:   ${{ vars.NODE_MGMT_MAP }}
          PYTHONWARNINGS:  'ignore:Unverified HTTPS request'
        run: |
          {
            set +e
            nac-test \
              -d "${WORKING_DIR}/data" \
              -d "${NAC_TEST_DEFAULTS}" \
              -t "${NAC_TEST_TEMPLATES}" \
              -f "${NAC_TEST_FILTERS}" \
              -o nac-test-baseline \
              --include baseline \
              --processes 2 \
              --minimal-reports
            code=$?
            set -e
            echo "exitcode=$code" >> "$GITHUB_OUTPUT"
            echo "baseline exit ${code} (informational only)"
            exit 0
          }

      - name: Extract failed test detail
        if: always()
        run: |
          {
            python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          from collections import defaultdict

          # Two separate files. The change-scope failures gate the summary
          # verdict; baseline is informational and must not appear under a green
          # headline as though it were change impact.
          SOURCES = (
              ("change",   "nac-test-results/robot_results/output.xml",  "nac-test-failures.md"),
              ("baseline", "nac-test-baseline/robot_results/output.xml", "nac-test-baseline-failures.md"),
          )

          # Heading + body text rather than a table row, so there is no column to
          # fit and no '|' to escape. The cap is generous but not unbounded:
          # Robot appends its own detail to some failures, and
          # $GITHUB_STEP_SUMMARY is capped at 1 MiB per step.
          MAX_MSG = 1200

          def collapse(s):
              # Robot messages are often multi-line. Collapsing to a single
              # paragraph keeps each failure to one readable block; the full
              # multi-line form stays available in log.html.
              return " ".join((s or "").split())

          for label, path, out in SOURCES:
              rows, ran = [], 0
              if os.path.exists(path):
                  for tc in ET.parse(path).iter("test"):
                      ran += 1
                      st = tc.find("status")
                      if st is None or st.get("status") != "FAIL":
                          continue
                      msg = collapse(st.text)
                      if len(msg) > MAX_MSG:
                          msg = msg[:MAX_MSG].rstrip() + " ... (truncated - see the full report)"
                      rows.append((
                          collapse(tc.get("name")),
                          msg or "_No failure message recorded._",
                      ))

              # Group by message. One data model defect fires Fail If once per
              # subnet per test type, so a single cause routinely produces three
              # or more identical entries - collapse them to one message with the
              # affected test names listed. dict preserves insertion order, so
              # the grouping follows output.xml order.
              grouped = defaultdict(list)
              for name, msg in rows:
                  grouped[msg].append(name)

              # Written EMPTY when there are no failures, so `[ -s file ]` is
              # false and the summary omits the section entirely.
              with open(out, "w", encoding="utf-8") as fh:
                  for msg, names in grouped.items():
                      if len(names) == 1:
                          fh.write(f"#### {names[0]}\n\n{msg}\n\n")
                      else:
                          fh.write(f"#### {len(names)} tests failed with the same cause\n\n")
                          for n in names:
                              fh.write(f"- `{n}`\n")
                          fh.write(f"\n{msg}\n\n")

              print(f"{label:9s}: {len(rows)} failed of {ran} ran, {len(grouped)} distinct cause(s) -> {out}")
          PY
            echo '--- change failures ---'
            cat nac-test-failures.md 2>/dev/null || true
            echo '--- baseline failures ---'
            cat nac-test-baseline-failures.md 2>/dev/null || true
          }

      - name: Upload nac-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nac-test-reports
          path: |
            nac-test-results/combined_summary.html
            nac-test-results/robot_results/report.html
            nac-test-results/robot_results/log.html
            nac-test-results/robot_results/output.xml
            nac-test-results/robot_results/xunit.xml
            nac-test-baseline/robot_results/report.html
            nac-test-baseline/robot_results/log.html
            nac-test-baseline/robot_results/output.xml
            nac-test-failures.md
            nac-test-baseline-failures.md
          retention-days: 30
          if-no-files-found: warn

      - name: Publish report to Pages
        id: pages
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            DEST="reports/run-${RUN_NUMBER}"
            mkdir -p "gh-pages/${DEST}/robot_results"
            mkdir -p "gh-pages/${DEST}/baseline/robot_results"

            # Stop Jekyll touching anything, and make the branch root serve.
            touch gh-pages/.nojekyll

            echo '--- available nac-test HTML (pabot_results excluded) ---'
            find nac-test-results nac-test-baseline -name '*.html' \
              -not -path '*/pabot_results/*' 2>/dev/null | sort || true
            echo '--------------------------------------------------------'

            copied=0

            # combined_summary.html links to robot_results/*.html, so that
            # directory structure MUST be preserved. Flat copies alone leave the
            # dashboard's internal links 404ing. pabot_results is deliberately
            # excluded - it is per-process scratch output and can be tens of MB.
            if [ -f nac-test-results/combined_summary.html ]; then
              cp nac-test-results/combined_summary.html "gh-pages/${DEST}/"
              copied=$((copied+1))
            fi

            for f in nac-test-results/robot_results/*.html; do
              [ -f "$f" ] || continue
              cp "$f" "gh-pages/${DEST}/robot_results/"
              copied=$((copied+1))
            done

            for n in report.html log.html; do
              [ -f "nac-test-results/robot_results/$n" ] \
                && cp "nac-test-results/robot_results/$n" "gh-pages/${DEST}/"
            done

            [ -f nac-test-results/robot_results/xunit.xml ] \
              && cp nac-test-results/robot_results/xunit.xml "gh-pages/${DEST}/robot_results/"

            # Kept in its own subtree so its combined_summary.html links to its
            # own robot_results and cannot collide with the change-verification
            # files.
            if [ -f nac-test-baseline/combined_summary.html ]; then
              cp nac-test-baseline/combined_summary.html "gh-pages/${DEST}/baseline/"
              copied=$((copied+1))
            fi

            for f in nac-test-baseline/robot_results/*.html; do
              [ -f "$f" ] || continue
              cp "$f" "gh-pages/${DEST}/baseline/robot_results/"
              copied=$((copied+1))
            done

            [ -f nac-test-baseline/robot_results/report.html ] \
              && cp nac-test-baseline/robot_results/report.html "gh-pages/${DEST}/baseline/"

            if [ -z "$(find "gh-pages/${DEST}/baseline" -type f 2>/dev/null)" ]; then
              rm -rf "gh-pages/${DEST}/baseline"
              echo "no baseline HTML produced - baseline/ omitted"
            fi

            if [ "$copied" = "0" ]; then
              echo "::warning::No nac-test HTML found - nothing to publish for ${DEST}"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # A directory with no index.html is a 404 on Pages. Prefer the
            # combined dashboard, then the Robot report, then the flat copy.
            if [ ! -f "gh-pages/${DEST}/index.html" ]; then
              if   [ -f "gh-pages/${DEST}/combined_summary.html" ]; then
                cp "gh-pages/${DEST}/combined_summary.html" "gh-pages/${DEST}/index.html"
              elif [ -f "gh-pages/${DEST}/robot_results/report.html" ]; then
                cp "gh-pages/${DEST}/robot_results/report.html" "gh-pages/${DEST}/index.html"
              elif [ -f "gh-pages/${DEST}/report.html" ]; then
                cp "gh-pages/${DEST}/report.html" "gh-pages/${DEST}/index.html"
              fi
            fi

            if [ -d "gh-pages/${DEST}/baseline" ] && [ ! -f "gh-pages/${DEST}/baseline/index.html" ]; then
              if   [ -f "gh-pages/${DEST}/baseline/combined_summary.html" ]; then
                cp "gh-pages/${DEST}/baseline/combined_summary.html" "gh-pages/${DEST}/baseline/index.html"
              elif [ -f "gh-pages/${DEST}/baseline/report.html" ]; then
                cp "gh-pages/${DEST}/baseline/report.html" "gh-pages/${DEST}/baseline/index.html"
              fi
            fi

            [ -f "gh-pages/${DEST}/index.html" ] \
              && echo "published=true"  >> "$GITHUB_OUTPUT" \
              || echo "published=false" >> "$GITHUB_OUTPUT"

            # Root landing page. Regenerated each run and therefore only links
            # the current one - the gh-pages checkout is created fresh here, so
            # older run numbers are not enumerable. keep_files:true means older
            # run directories persist on the branch and remain reachable by URL.
            BASELINE_LINK=''
            if [ -f "gh-pages/${DEST}/baseline/index.html" ]; then
              BASELINE_LINK=" (<a href=\"${DEST}/baseline/\">baseline</a>)"
            fi
            {
              echo '<!doctype html><meta charset="utf-8">'
              echo '<title>nac-webinar test reports</title>'
              echo '<h1>ACI NaC post-deploy test reports</h1><ul>'
              echo "<li><a href=\"${DEST}/\">run-${RUN_NUMBER}</a>${BASELINE_LINK} &mdash; ${COMMIT_SHA}</li>"
              echo '</ul>'
              echo '<p>Older runs remain published at <code>reports/run-&lt;N&gt;/</code>.</p>'
            } > gh-pages/index.html

            echo "--- published tree for ${DEST} ---"
            find "gh-pages/${DEST}" -type f | sort
            echo "--- total size ---"
            du -sh "gh-pages/${DEST}"
          }

      - name: Deploy to Pages
        id: deploy
        if: always() && github.ref == 'refs/heads/main' && steps.pages.outputs.published == 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 #v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true

      - name: Report Pages outcome
        if: always() && github.ref == 'refs/heads/main'
        env:
          PAGES_STAGED: ${{ steps.pages.outputs.published }}
          PAGES_DEPLOY: ${{ steps.deploy.outcome }}
          RUN_NUMBER:   ${{ github.run_number }}
        run: |
          {
            URL="https://conmurphy.github.io/nac-webinar/reports/run-${RUN_NUMBER}/"
            echo "published=${PAGES_STAGED:-n/a} deploy_outcome=${PAGES_DEPLOY:-n/a}"
            if [ "${PAGES_STAGED:-}" != "true" ]; then
              echo "::warning::No HTML was staged - nac-test produced no report. ${URL} will 404."
            elif [ "${PAGES_DEPLOY:-}" != "success" ]; then
              echo "::error::gh-pages deploy failed (${PAGES_DEPLOY:-n/a}). Check that this job has 'permissions: contents: write'. ${URL} will 404."
            else
              echo "published to ${URL} - allow ~1 min for the Pages build"
            fi
          }

      - name: Build step summary
        if: always()
        shell: bash
        env:
          # All ${{ }} interpolation stays out of the script body - the runner
          # substitutes it as literal text before bash parses, so a quote or
          # newline in any upstream output would break or inject into the shell.
          TOTAL:         ${{ steps.nactest.outputs.total }}
          PASSED:        ${{ steps.nactest.outputs.passed }}
          FAILED:        ${{ steps.nactest.outputs.failed }}
          SKIPPED:       ${{ steps.nactest.outputs.skipped }}
          APPLY_RESULT:  ${{ needs.apply.result }}
          PLAN_SUMMARY:  ${{ needs.plan.outputs.summary }}
          INCLUDE_TAGS:  ${{ inputs.include_tags }}
          SCOPE:         ${{ inputs.changed_subnets || needs.plan.outputs.changed_subnets }}
          PAGES_STAGED:  ${{ steps.pages.outputs.published }}
          PAGES_DEPLOY:  ${{ steps.deploy.outcome }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL:    https://conmurphy.github.io/nac-webinar/reports/run-${{ github.run_number }}/
          FAILURES_FILE:          nac-test-failures.md
          BASELINE_FAILURES_FILE: nac-test-baseline-failures.md
        run: |
          {
            set -uo pipefail
            {
              echo '# 4. Post-deploy operational verification (nac-test)'
              echo ''
              if [ "${APPLY_RESULT:-}" = "success" ]; then
                echo "Verifying the change just applied: **${PLAN_SUMMARY:-unknown}**"
              else
                echo '**Standalone run** - verifying the fabric as it currently stands, with no deployment in this run.'
              fi
              echo ''
              echo "Tag filter: \`${INCLUDE_TAGS:-none (full change-verification set)}\`"
              echo ''
              echo "ICMP scope: \`${SCOPE:-all configured subnets (full sweep)}\`"
              echo ''

              if [ "${FAILED:-0}" = "0" ] && [ "${TOTAL:-0}" != "0" ]; then
                echo "✅ **${PASSED:-0} of ${TOTAL:-0} operational tests passed.**"
                echo ''
                printf '%s\n' \
                  "- Fabric-sourced ICMP from each BD anycast gateway (iping on a border leaf, inside the tenant VRF)" \
                  "- Client reachability to those same gateways over the L3Out" \
                  "- Static path bindings and encap" \
                  "- UCS domain interface state, admin and operational" \
                  "- L3Out BGP state" \
                  "- vPC state" \
                  "- DNS reachability"
              elif [ "${TOTAL:-0}" = "0" ]; then
                echo "⚠️ **No tests ran** - check the nac-test step logs (template render, a tag filter matching nothing, missing SSHLibrary, or a credential failure)."
              else
                echo "❌ **${FAILED:-0} of ${TOTAL:-0} operational tests failed.**"
              fi

              if [ "${SKIPPED:-0}" != "0" ]; then
                echo ''
                echo "ℹ️ ${SKIPPED} test(s) skipped - either outside the change scope, or NODE_MGMT_MAP / SWITCH_USER not configured."
              fi

              echo ''
              echo '| result | count |'
              echo '| --- | --- |'
              echo "| passed | ${PASSED:-0} |"
              echo "| failed | ${FAILED:-0} |"
              echo "| skipped | ${SKIPPED:-0} |"
              echo "| total | ${TOTAL:-0} |"
              echo ''

              # Only advertise the Pages link if HTML was actually staged AND the
              # push succeeded - otherwise the URL is a 404.
              if [ "${PAGES_STAGED:-}" = "true" ] && [ "${PAGES_DEPLOY:-}" = "success" ]; then
                echo "📊 **[Open the interactive test report](${REPORT_URL})**"
              else
                echo "📊 Interactive report not published (staged=${PAGES_STAGED:-n/a}, deploy=${PAGES_DEPLOY:-n/a}) - download the \`nac-test-reports\` artifact from [this run](${RUN_URL}#artifacts)."
              fi

              # Change-scope failures gate the verdict above. Not wrapped in
              # <details>: it was always open, and h4 headings inside a details
              # element render but lose their anchors.
              if [ -s "${FAILURES_FILE}" ]; then
                echo ''
                echo '### ❌ Failed tests'
                echo ''
                cat "${FAILURES_FILE}"
              fi

              # Baseline failures are pre-existing fabric/upstream state. Kept
              # collapsed so they never appear to contradict a green
              # change-verification verdict.
              if [ -s "${BASELINE_FAILURES_FILE}" ]; then
                echo ''
                echo '### Fabric baseline failures (informational)'
                echo ''
                cat "${BASELINE_FAILURES_FILE}"
                echo ''
              fi
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          }