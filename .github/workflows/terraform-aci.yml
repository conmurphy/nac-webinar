      # Build summary to be used with nac-test analysis
      - name: Build step summary
        if: always()
        working-directory: .
        run: |
          TOTAL="${{ steps.nactest.outputs.total }}"
          PASSED="${{ steps.nactest.outputs.passed }}"
          FAILED="${{ steps.nactest.outputs.failed }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo '# Applied to APIC'
            echo ''
            echo "Plan applied: **${{ needs.plan.outputs.summary }}**"
            echo ''
            echo "Pre-change prediction: ${{ needs.plan.outputs.nd_critical }} critical, ${{ needs.plan.outputs.nd_major }} major"
            echo ''
            JOB="${{ needs.plan.outputs.nd_job_id }}"
            if [ -n "$JOB" ]; then
              echo "🔗 [Pre-change analysis in Nexus Dashboard](${{ vars.ND_HOST }}${{ env.ND_PRECHANGE_UI_PATH }}/${{ vars.ND_FABRIC }}/${JOB})"
            fi
            echo ''
            echo '---'
            echo ''
            echo '## Post-change operational verification (nac-test)'
            echo ''
            if [ "${FAILED:-0}" = "0" ] && [ "${TOTAL:-0}" != "0" ]; then
              echo "✅ **All ${TOTAL} operational tests passed.** BGP peerings, vPC state, static paths and interfaces verified against the data model."
            elif [ "${TOTAL:-0}" = "0" ]; then
              echo "⚠️ **No tests ran** - check the nac-test step logs (template render or credential failure)."
            else
              echo "❌ **${FAILED} of ${TOTAL} operational tests failed.** The change is applied; investigate below."
            fi
            echo ''
            echo '| result | count |'
            echo '| --- | --- |'
            echo "| passed | ${PASSED:-0} |"
            echo "| failed | ${FAILED:-0} |"
            echo "| total | ${TOTAL:-0} |"
            echo ''
            echo "📊 **[Download the full HTML report](${RUN_URL}#artifacts)** — open \`report.html\` for the interactive Robot Framework dashboard."
            echo ''
            echo "📊 **[Open the interactive test report](https://conmurphy.github.io/nac-webinar/reports/run-${{ github.run_number }}/)**"
            echo ''
            if [ -s nac-test-failures.md ]; then
              echo '<details open><summary>Failed tests</summary>'
              echo ''
              cat nac-test-failures.md
              echo ''
              echo '</details>'
            fi
            echo ''
            echo '> Fabric baseline tests (hardware, environmental, external reachability) run separately and are informational - they reflect pre-existing fabric state, not this change.'
          } >> "$GITHUB_STEP_SUMMARY"

