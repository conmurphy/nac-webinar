      # Upload artifacts when using nac-test analysis
      - name: Upload nac-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nac-test-reports
          path: |
            nac-test-results/combined_summary.html
            nac-test-results/robot_results/report.html
            nac-test-results/robot_results/log.html
            nac-test-results/robot_results/output.xml
            nac-test-results/robot_results/xunit.xml
            nac-test-baseline/robot_results/report.html
            nac-test-baseline/robot_results/log.html
            nac-test-failures.md
          retention-days: 30
          if-no-files-found: warn
      
      - name: Publish report to Pages
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: .
        run: |
          DEST="reports/run-${{ github.run_number }}"
          mkdir -p "gh-pages/${DEST}"
          cp -r nac-test-results/robot_results/*.html "gh-pages/${DEST}/" || true
          cp nac-test-results/combined_summary.html "gh-pages/${DEST}/index.html" || true

      - name: Deploy to Pages
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true