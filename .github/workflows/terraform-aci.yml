name: Terraform ACI

on:
  push:
    branches: [main]
    paths:
      - 'aci-config/**'
      - '.github/workflows/terraform-aci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aci-config/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      baseline:
        description: 'ND baseline snapshot strategy'
        required: true
        default: 'analyze'
        type: choice
        options: [analyze, latest]

concurrency:
  group: terraform-aci
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'
  TF_INPUT: '0'
  TF_VERSION: '1.12.2'
  WORKING_DIR: aci-config
  TF_STATE_SCHEMA: aci_nac
  TF_DATA_DIR: /home/runner/_work/_tfdata/aci-config
  TF_PLUGIN_CACHE_DIR: /home/runner/_work/_tfcache
  ND_FAIL_ON: none                 # change to 'major' to make ND a hard gate

permissions:
  contents: read
  pull-requests: write

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — Plan + Nexus Dashboard pre-change analysis
  # ══════════════════════════════════════════════════════════
  plan:
    name: Validate & Plan
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto-plan
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      exitcode:    ${{ steps.plan.outputs.exitcode }}
      summary:     ${{ steps.summary.outputs.line }}
      nd_snapshot: ${{ steps.baseline.outputs.snapshot_id }}
      nd_exitcode: ${{ steps.prechange.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"
          [ -d "$TF_DATA_DIR/modules" ] && echo "module cache: WARM" || echo "module cache: COLD"

      - name: Verify Tools
        run: |
          terraform version
          nac-analytics version

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?Missing TF_STATE_CONN_STR}"
          start=$(date +%s)
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
          echo "init took $(( $(date +%s) - start ))s"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s \
            -detailed-exitcode -no-color \
            -out=tfplan
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          if [ -f tfplan ]; then
            terraform show -no-color tfplan > tfplan.txt
            terraform show -json    tfplan > plan.json
          fi

          [ "$code" = "1" ] && { echo "::error::Terraform Plan Failed"; exit 1; }
          exit 0
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      - name: Extract summary line
        id: summary
        run: |
          line="unknown"
          [ -f tfplan.txt ] && line=$(grep -E '^(Plan:|No changes)' tfplan.txt | head -1)
          echo "line=${line}" >> "$GITHUB_OUTPUT"

      # ---------- Nexus Dashboard ----------
      - name: ND doctor
        if: steps.plan.outputs.exitcode == '2'
        run: nac-analytics nd doctor --config nac-analytics.yaml -output text
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: Pin ND baseline snapshot
        id: baseline
        if: steps.plan.outputs.exitcode == '2'
        run: |
          strategy="${{ github.event.inputs.baseline || 'analyze' }}"
          if [ "$strategy" = "analyze" ]; then
            snap="$(nac-analytics nd analyze --config nac-analytics.yaml)"
          else
            snap="$(nac-analytics nd snapshots latest --config nac-analytics.yaml)"
          fi
          echo "snapshot_id=${snap}" >> "$GITHUB_OUTPUT"
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: ND pre-change analysis
        id: prechange
        if: steps.plan.outputs.exitcode == '2'
        run: |
          set +e
          nac-analytics nd prechange plan.json \
            --config nac-analytics.yaml \
            --fail-on "${ND_FAIL_ON}" \
            --detail full \
            --output markdown \
            --report-file nd-prechange.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: ND compliance
        if: steps.plan.outputs.exitcode == '2'
        continue-on-error: true
        run: |
          nac-analytics nd compliance --config nac-analytics.yaml --output markdown --report-file nd-compliance.md
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: Build step summary
        if: always()
        run: |
          {
            echo "# ACI Change Analysis"
            echo "**Plan Summary:** ${{ steps.summary.outputs.line }}"
            
            if [ -f nd-prechange.md ]; then
              echo "## 1. Nexus Dashboard Pre-Change"
              echo "Baseline: \`${{ steps.baseline.outputs.snapshot_id }}\`"
              cat nd-prechange.md
              echo "### Compliance"
              [ -f nd-compliance.md ] && cat nd-compliance.md || echo "_No compliance data._"
              echo "---"
            fi

            echo "## 2. Terraform Plan"
            if [ -f tfplan.txt ]; then
              echo '```hcl'
              grep -E '^  # ' tfplan.txt | head -50 || echo "(none)"
              echo '```'
              echo "<details><summary>Full Plan</summary>"
              echo ""
              echo '```hcl'
              head -c 50000 tfplan.txt
              echo '```'
              echo "</details>"
            else
              echo "⚠️ No plan found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/tfplan.txt
            ${{ env.WORKING_DIR }}/plan.json
            ${{ env.WORKING_DIR }}/nd-prechange.md

  # ══════════════════════════════════════════════════════════
  # JOB 2 — Apply + post-change delta (Approval Required)
  # ══════════════════════════════════════════════════════════
  apply:
    name: Apply to APIC
    needs: plan
    if: |
      needs.plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s tfplan
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      - name: ND post-change delta
        id: delta
        continue-on-error: true
        run: |
          echo "Triggering post-change analysis..."
          POST="$(nac-analytics nd analyze --config nac-analytics.yaml)"
          nac-analytics nd delta "${{ needs.plan.outputs.nd_snapshot }}" "${POST}" \
            --config nac-analytics.yaml --detail full --output markdown --report-file nd-delta.md
        env:
          ND_HOST:     ${{ secrets.ND_HOST }}
          ND_USER:     ${{ secrets.ND_USER }}
          ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
          ND_FABRIC:   ${{ secrets.ND_FABRIC }}

      - name: Build step summary
        if: always()
        run: |
          {
            echo "# Apply Results"
            echo "## Nexus Dashboard Delta"
            [ -f nd-delta.md ] && cat nd-delta.md || echo "_No delta produced._"
            echo "## Terraform Outputs"
            echo '```json'
            terraform output -json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"