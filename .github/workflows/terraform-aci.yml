      # ═══════════════ Post-change operational verification ═══════════════
      - name: nac-test - change verification
        id: nactest
        continue-on-error: true
        working-directory: .
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          PYTHONWARNINGS: 'ignore:Unverified HTTPS request'
        run: |
          set +e
          nac-test \
            -d "${WORKING_DIR}/data" \
            -d "${NAC_TEST_DEFAULTS}" \
            -t "${NAC_TEST_TEMPLATES}" \
            -f "${NAC_TEST_FILTERS}" \
            -o nac-test-results \
            --exclude baseline \
            --exclude fabric-ping \
            --minimal-reports
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Parse real per-test results from output.xml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET, os, sys
          try:
              t = ET.parse('nac-test-results/robot_results/output.xml')
          except Exception:
              print("total=0"); print("passed=0"); print("failed=0")
              sys.exit(0)
          tests = list(t.iter('test'))
          passed = sum(1 for x in tests
                       if x.find('status').get('status') == 'PASS')
          failed = sum(1 for x in tests
                       if x.find('status').get('status') == 'FAIL')
          print(f"total={len(tests)}")
          print(f"passed={passed}")
          print(f"failed={failed}")
          PY

          echo "nac-test exit ${code}"
          exit 0

      - name: nac-test - fabric baseline (informational)
        id: nactest_baseline
        continue-on-error: true
        working-directory: .
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          PYTHONWARNINGS: 'ignore:Unverified HTTPS request'
        run: |
          set +e
          nac-test \
            -d "${WORKING_DIR}/data" \
            -d "${NAC_TEST_DEFAULTS}" \
            -t "${NAC_TEST_TEMPLATES}" \
            -f "${NAC_TEST_FILTERS}" \
            -o nac-test-baseline \
            --include baseline \
            --minimal-reports
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          echo "baseline exit ${code} (informational only)"
          exit 0

      - name: Extract failed test detail
        if: always()
        working-directory: .
        run: |
          python3 - > nac-test-failures.md <<'PY'
          import xml.etree.ElementTree as ET, os
          rows = []
          for label, path in (
              ("change", "nac-test-results/robot_results/output.xml"),
              ("baseline", "nac-test-baseline/robot_results/output.xml"),
          ):
              if not os.path.exists(path):
                  continue
              t = ET.parse(path)
              for tc in t.iter('test'):
                  st = tc.find('status')
                  if st.get('status') != 'FAIL':
                      continue
                  msg = ' '.join((st.text or '').split())[:160]
                  rows.append((label, tc.get('name'), msg))
          if rows:
              print('| scope | test | reason |')
              print('| --- | --- | --- |')
              for label, name, msg in rows:
                  name = name.replace('|', '\|')
                  msg = msg.replace('|', '\|')
                  print(f'| {label} | {name} | {msg} |')
          else:
              print('_All tests passed._')
          PY
          cat nac-test-failures.md
      
