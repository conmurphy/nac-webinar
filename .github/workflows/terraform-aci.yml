name: Terraform ACI

on:
  push:
    branches: [main]
    paths:
      - 'aci-config/**'
      - '.github/workflows/terraform-aci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aci-config/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      baseline:
        description: 'ND baseline: latest is instant, analyze runs a real job (~7 min)'
        required: true
        default: 'latest'
        type: choice
        options: [latest, analyze]

concurrency:
  group: terraform-aci
  cancel-in-progress: false

env:
  # ---- Terraform ----
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'
  TF_INPUT: '0'
  WORKING_DIR: aci-config
  TF_STATE_SCHEMA: aci_nac
  TF_DATA_DIR: /home/runner/_work/_tfdata/aci-config
  TF_PLUGIN_CACHE_DIR: /home/runner/_work/_tfcache
  # ---- Nexus Dashboard ----
  # ND is reached by IP, so the cert SAN cannot match. Verification off.
  ND_VERIFY_SSL: 'false'
  # This cluster advertises LDAP and local; the CLI default DefaultAuth 401s.
  ND_DOMAIN: local
  # Pre-change gate. 'critical,major' makes ND block the apply on exit 3.
  ND_FAIL_ON: '' #'critical,major'
  # Post-change delta reports the same severities but never blocks (step exits 0).
  ND_DELTA_FAIL_ON: '' #'critical,major'
  ND_JOB_TIMEOUT_MINUTES: '30'
  ND_POLL_INTERVAL: '15'
  # Fallback only. The real link is read from the report's prechange_ui_url.
  ND_PRECHANGE_UI_PATH: '/analysis-hub/pre-change-analysis'
  # ---- nac-test ----
  NAC_TEST_DIR: tests-and-validations/02-post-deploy-tests
  NAC_TEST_TEMPLATES: tests-and-validations/02-post-deploy-tests/tests/templates
  NAC_TEST_FILTERS: tests-and-validations/02-post-deploy-tests/tests/filters
  NAC_TEST_DEFAULTS: tests-and-validations/02-post-deploy-tests/tests/defaults
  # Ensure SSH and other tools find a writable home. Observed under oc exec that
  # HOME can resolve to '/', producing "Could not create directory '/.ssh'".
  HOME: /home/runner

# permissions:
#   contents: read
#   pull-requests: write

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — Plan + Nexus Dashboard pre-change analysis
  # Any branch or PR. No approval gate.
  # ══════════════════════════════════════════════════════════
  plan:
    name: Validate & Plan
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto-plan
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    # ND connection settings for every step in this job.
    # host/fabric are repository VARIABLES; user/password are environment SECRETS.
    env:
      ND_HOST:     ${{ vars.ND_HOST }}
      ND_FABRIC:   ${{ vars.ND_FABRIC }}
      ND_USER:     ${{ secrets.ND_USER }}
      ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
    outputs:
      exitcode:        ${{ steps.plan.outputs.exitcode }}
      summary:         ${{ steps.summary.outputs.line }}
      nd_snapshot:     ${{ steps.baseline.outputs.snapshot_id }}
      nd_exitcode:     ${{ steps.prechange.outputs.exitcode }}
      nd_job_id:       ${{ steps.prechange.outputs.job_id }}
      nd_critical:     ${{ steps.prechange.outputs.critical }}
      nd_major:        ${{ steps.prechange.outputs.major }}
      nd_minor:        ${{ steps.prechange.outputs.minor }}
      nd_warning:      ${{ steps.prechange.outputs.warning }}
      nd_ui_url:       ${{ steps.ndcontext.outputs.ui_url }}
      changed_subnets: ${{ steps.changed.outputs.subnets }}
      changed_bds:     ${{ steps.changed.outputs.bds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"
          if [ -d "$TF_DATA_DIR/modules" ]; then
            echo "module cache: WARM"
          else
            echo "module cache: COLD - first init will be slow"
          fi

      - name: Verify tools and ND settings
        run: |
          terraform version
          nac-analytics version
          jq --version
          echo "ND_HOST   : ${ND_HOST:-<EMPTY>}"
          echo "ND_FABRIC : ${ND_FABRIC:-<EMPTY>}"
          [ -n "$ND_USER" ]     && echo "ND_USER   : set"     || echo "ND_USER   : <EMPTY>"
          [ -n "$ND_PASSWORD" ] && echo "ND_PASSWORD: set"    || echo "ND_PASSWORD: <EMPTY>"

      - name: Show NaC data files
        run: |
          echo "cwd: $(pwd)"
          find data -type f \( -name '*.yaml' -o -name '*.yml' \) | sort

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty - check environment secrets}"
          : "${TF_STATE_SCHEMA:?TF_STATE_SCHEMA is empty - check workflow env}"
          start=$(date +%s)
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
          echo "init took $(( $(date +%s) - start ))s"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s \
            -detailed-exitcode -no-color \
            -out=tfplan
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          if [ -f tfplan ]; then
            terraform show -no-color tfplan > tfplan.txt
            terraform show -json    tfplan > plan.json
          else
            echo "No plan file produced - plan failed before writing output." > tfplan.txt
            echo '{}' > plan.json
          fi

          if [ "$code" = "1" ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          exit 0
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      - name: Extract summary line
        id: summary
        run: |
          line="unknown"
          if [ -f tfplan.txt ]; then
            line="$(grep -E '^(Plan:|No changes)' tfplan.txt | head -1 || echo 'unknown')"
          fi
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          echo "$line"

      - name: Build plan change table
        id: plantable
        if: always()
        run: |
          if [ -f plan.json ]; then
            python3 "${GITHUB_WORKSPACE}/.github/scripts/plan_summary.py" \
              plan.json > plan-summary.md
          else
            echo "_No plan JSON produced._" > plan-summary.md
          fi
          head -40 plan-summary.md

      # ─────────── Change scoping for post-deploy tests ───────────
      # The YAML data model is declarative and holds no notion of "new" - a BD
      # added minutes ago is byte-identical to one added months ago. plan.json is
      # the only place in this pipeline that knows what actually changed, so the
      # subnet list is extracted here and handed to nac-test at runtime via
      # CHANGED_SUBNETS. An empty list means the suite runs a full sweep.
      - name: Extract changed subnets for post-deploy tests
        id: changed
        if: always()
        run: |
          if [ ! -f plan.json ]; then
            echo "subnets=" >> "$GITHUB_OUTPUT"
            echo "bds=" >> "$GITHUB_OUTPUT"
            echo "no plan.json - post-deploy tests will run a full sweep"
            exit 0
          fi

          # fvSubnet objects being created or updated. The DN carries both the BD
          # name and the subnet CIDR, so one pass yields both lists. 'dn' can be
          # unknown on creates, so fall back to content.ip.
          jq -r '
            .resource_changes[]
            | select((.change.actions // []) | any(. == "create" or . == "update"))
            | (.change.after // {}) as $a
            | select(($a.class_name // "") == "fvSubnet")
            | if (($a.dn // "") | test("/BD-[^/]+/subnet-\[")) then
                ($a.dn | capture("/BD-(?<bd>[^/]+)/subnet-\[(?<ip>[^\]]+)\]")
                        | "\(.bd)\t\(.ip)")
              elif (($a.content.ip // "") != "") then
                "unknown\t\($a.content.ip)"
              else
                empty
              end
          ' plan.json 2>/dev/null | sort -u > changed-subnets.tsv || true

          SUBNETS="$(cut -f2 changed-subnets.tsv | paste -sd, - || true)"
          BDS="$(cut -f1 changed-subnets.tsv | sort -u | paste -sd, - || true)"

          echo "subnets=${SUBNETS}" >> "$GITHUB_OUTPUT"
          echo "bds=${BDS}"         >> "$GITHUB_OUTPUT"
          echo "changed subnets: ${SUBNETS:-<none - tests will run a full sweep>}"
          echo "changed BDs    : ${BDS:-<none>}"
          echo '--- changed-subnets.tsv ---'
          cat changed-subnets.tsv || true

      - name: Prepare ND payload
        id: ndpayload
        if: steps.plan.outputs.exitcode == '2'
        run: |
          # this was the error from ND which failed
          # ND wants double brackets; the plan produced single.
          #  Rn 'rsnodeL3OutAtt-[topology/pod-1/node-1101]' does not match expected
          #  rn 'rsnodeL3OutAtt-[[topology/pod-1/node-1101]]'
          # going to drop it so the test passes for the demo
          DROP='["l3extRsNodeL3OutAtt","l3extLNodeP","l3extLIfP","l3extRsPathL3OutAtt","l3extMember","l3extIp","bgpPeerP","bgpAsP","bgpLocalAsnP"]'
          jq -c --argjson drop "$DROP" '
            .resource_changes |= map(
              select(
                ((.change.after.class_name // .change.before.class_name // "")
                 | IN($drop[])) | not
              )
            )
          ' plan.json > plan-nd.json

          before=$(jq '.resource_changes | length' plan.json)
          after=$(jq '.resource_changes | length' plan-nd.json)
          echo "resource_changes: ${before} -> ${after} (filtered $((before-after)))"
          echo "filtered=$((before-after))" >> "$GITHUB_OUTPUT"

      # ─────────────── Nexus Dashboard ───────────────
      - name: ND doctor
        if: steps.plan.outputs.exitcode == '2'
        run: nac-analytics nd doctor --output text

      - name: Pin ND baseline snapshot
        id: baseline
        if: steps.plan.outputs.exitcode == '2'
        run: |
          strategy="${{ github.event.inputs.baseline || 'latest' }}"
          echo "baseline strategy: ${strategy}"

          set +e
          if [ "$strategy" = "analyze" ]; then
            nac-analytics nd analyze --output text > snap.out 2> snap.err
          else
            nac-analytics nd snapshots latest --output text > snap.out 2> snap.err
          fi
          rc=$?
          set -e

          # FIXED: was grepping prechange.err, which does not exist in this step.
          echo "--- CLI diagnostics (stderr) ---"
          grep -v -e "TLS certificate verification is disabled" \
                  -e "more 'online' snapshot(s) exist" \
                  snap.err || true
          echo "--------------------------------"

          # The snapshot ID is the ONLY thing on stdout.
          # Do NOT read stderr - it carries the analysis JOB id, a different
          # identifier that prechange/delta reject.
          snap="$(tail -n1 snap.out | tr -d '[:space:]')"

          if [ -z "$snap" ]; then
            echo "::warning::No baseline snapshot resolved (rc=${rc}); prechange will use 'latest'"
          fi
          echo "snapshot_id=${snap}" >> "$GITHUB_OUTPUT"
          echo "baseline snapshot: ${snap:-<none>}"

      - name: ND pre-change analysis
        id: prechange
        if: steps.plan.outputs.exitcode == '2'
        run: |
          BASELINE="${{ steps.baseline.outputs.snapshot_id }}"
          [ -n "$BASELINE" ] || BASELINE="latest"
          echo "analysing plan-nd.json against baseline: ${BASELINE}"

          # NOTE: --report-file applies to JUnit output only.
          # With --output markdown the report goes to STDOUT.
          set +e
          nac-analytics nd prechange plan-nd.json "$BASELINE" \
            --fail-on "${ND_FAIL_ON}" \
            --detail full \
            --output markdown \
            > prechange.raw 2> prechange.err
          code=$?
          set -e

          echo "--- CLI diagnostics (stderr) ---"
          cat prechange.err || true
          echo "--------------------------------"
          cat prechange.raw || true

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Trim any preamble before the first markdown heading
          sed -n '/^# /,$p' prechange.raw > nd-prechange.md || true
          [ -s nd-prechange.md ] || \
            echo "_No Nexus Dashboard pre-change report produced (exit ${code})._" > nd-prechange.md

          # Read the per-severity counts from the "New anomalies" table only
          sev_count() {
            awk -v sev="$1" '
              /^## New anomalies/ { inblock=1; next }
              inblock && /^## /   { exit }
              inblock {
                n = split($0, f, "|")
                if (n >= 3) {
                  gsub(/^ +| +$/, "", f[2]); gsub(/^ +| +$/, "", f[3])
                  if (f[2] == sev) { print f[3]; exit }
                }
              }
            ' nd-prechange.md
          }
          crit="$(sev_count critical)"; maj="$(sev_count major)"
          min="$(sev_count minor)";    warn="$(sev_count warning)"
          echo "critical=${crit:-0}" >> "$GITHUB_OUTPUT"
          echo "major=${maj:-0}"     >> "$GITHUB_OUTPUT"
          echo "minor=${min:-0}"     >> "$GITHUB_OUTPUT"
          echo "warning=${warn:-0}"  >> "$GITHUB_OUTPUT"
          echo "new anomalies - critical:${crit:-0} major:${maj:-0} minor:${min:-0} warning:${warn:-0}"

          job_id="$(awk -F'|' '$2 ~ /^ *job_id *$/ {gsub(/^ +| +$/,"",$3); print $3; exit}' nd-prechange.md)"
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"
          echo "job_id: ${job_id:-<none>}"
          echo "gate_ran=true" >> "$GITHUB_OUTPUT"

          case "$code" in
            0) echo "ND: no new anomalies at or above ${ND_FAIL_ON}" ;;
            2) echo "::warning::ND analysis job failed, stopped, or timed out" ;;
            3) echo "::error::ND predicts new ${ND_FAIL_ON} anomalies - blocking apply"
               exit 1 ;;
            4) echo "::warning::ND rejected the configuration (possible bad input) - the pre-change analysis did NOT finish for this change so review the plan manually before approving."
               echo "gate_ran=false" >> "$GITHUB_OUTPUT" ;;
            5) echo "::error::ND authentication or authorisation failure"
               exit 1 ;;
            *) echo "::error::ND unexpected error (exit $code)"
               exit 1 ;;
          esac
          exit 0

      # ─────────── JSON fetch + filtered anomaly table ───────────
      # Re-reads the SAME completed job via --job-id. Nothing is re-analysed.
      # If --output json needs --report-file on your build, change the redirect.
      - name: ND anomaly context table
        id: ndcontext
        if: always() && steps.prechange.outputs.job_id != ''
        continue-on-error: true
        run: |
          WANT_JOB="${{ steps.prechange.outputs.job_id }}"

          set +e
          nac-analytics nd prechange \
            --job-id "${WANT_JOB}" \
            --fail-on none \
            --output json \
            > nd-prechange.json 2> ndjson.err
          rc=$?
          set -e
          echo "json fetch rc=${rc}"
          grep -v -e "TLS certificate verification is disabled" \
                  -e "more 'online' snapshot(s) exist" \
                  ndjson.err || true

          fallback() {
            echo "_$1_" > nd-anomalies.md
            echo "::warning::anomaly context skipped - $1"
            exit 0
          }

          [ -s nd-prechange.json ] || fallback "the CLI produced no JSON output"

          # Guard against the malformed-JSON writer bug.
          if ! jq empty nd-prechange.json 2> jq-err.txt; then
            head -3 jq-err.txt || true
            fallback "the CLI emitted invalid JSON"
          fi

          # Confirm we re-read the gate's job rather than submitting a new one.
          GOT_JOB="$(jq -r '.details.job_id // empty' nd-prechange.json)"
          echo "gate job_id : ${WANT_JOB}"
          echo "json job_id : ${GOT_JOB:-<none>}"
          if [ -n "$GOT_JOB" ] && [ "$GOT_JOB" != "$WANT_JOB" ]; then
            echo "::warning::JSON fetch returned job ${GOT_JOB}, not the gate's ${WANT_JOB} - --job-id may be submitting a NEW analysis"
          fi

          ui="$(jq -r '.details.prechange_ui_url // empty' nd-prechange.json)"
          echo "ui_url=${ui}" >> "$GITHUB_OUTPUT"
          echo "ui_url: ${ui:-<none>}"

          # Signal filter.
          #
          # NO TIMESTAMP CUTOFF. Compliance violations carry the epoch of rule
          # import (2026-08-24), not of submission, so a time filter would drop
          # the very anomalies that block the gate. Filtering on anomalySource
          # is also unsafe: compliance and traffic noise both report
          # "telemetry". We filter on cleared / type / acknowledged only, and
          # label the result as context rather than delta.
          #
          # No backslash escapes in this program on purpose - they do not
          # survive copy/paste reliably. The markdown pipe escape arrives via
          # --arg so jq never parses it.
          set +e
          jq -r --arg pipe '\|' '
            def rank: {"critical":0,"major":1,"minor":2,"warning":3}[.] // 9;
            def esc: tostring | gsub("[|]"; $pipe) | gsub("[\n\r]+"; " ");

            (.delta_detail.anomalies.data.anomalies // []) as $all
            | ($all | length) as $total
            | ($all | map(select((.cleared // false) == true)) | length) as $cleared
            | ($all | map(select(.anomalyType == "TRAFFIC_ANALYTICS")) | length) as $traffic
            | ($all | map(select((.acknowledged // false) == true)) | length) as $acked
            | ($all
                | map(select((.cleared // false) == false))
                | map(select(.anomalyType != "TRAFFIC_ANALYTICS"))
                | map(select((.acknowledged // false) == false))
                | sort_by(.severity | rank)
              ) as $sig
            | if $total == 0 then
                "_No anomaly detail returned by this endpoint._"
              else
                "Fabric-wide anomaly state, filtered for signal. **This is context, not change impact** - the authoritative new-anomaly counts are in the severity table above.",
                "",
                "Suppressed \($cleared) cleared, \($traffic) traffic-analytics, \($acked) acknowledged, out of \($total) records.",
                "",
                ( if ($sig | length) == 0 then
                    "_No active, unacknowledged, non-telemetry anomalies._"
                  else
                    "| severity | category | rule / entity | detail |",
                    "| --- | --- | --- | --- |",
                    ( $sig[] |
                      "| \(.severity | esc) | \(.category | esc) | \(
                         if (.ruleName // "") != "" then (.ruleName | esc)
                         elif (.entityName // "") != "" then (.entityName | esc)
                         else "-" end
                       ) | \(.anomalyString | esc) |"
                    )
                  end )
              end
          ' nd-prechange.json > nd-anomalies.md
          jqrc=$?
          set -e
          if [ "$jqrc" != "0" ] || [ ! -s nd-anomalies.md ]; then
            fallback "the anomaly filter failed (jq exit ${jqrc})"
          fi

          cat nd-anomalies.md
          exit 0

      - name: Tidy ND report
        id: ndclean
        if: always()
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/nd_report_clean.py" \
            nd-prechange.md \
            --clean-out nd-prechange-clean.md \
            --violations-out nd-violations.md
          echo '--- violations ---'
          cat nd-violations.md

      # Fetch the SAME completed analysis as JUnit for archival.
      # --job-id means ND does not re-run anything.
      - name: ND JUnit report
        if: always() && steps.prechange.outputs.job_id != ''
        continue-on-error: true
        run: |
          nac-analytics nd prechange \
            --job-id "${{ steps.prechange.outputs.job_id }}" \
            --fail-on none \
            --output junit \
            --report-file prechange-report.xml

      # ───── Summary: ND first, Terraform second ─────
      - name: Build step summary
        if: always()
        run: |
          CRIT="${{ steps.prechange.outputs.critical }}"
          MAJ="${{ steps.prechange.outputs.major }}"
          MIN="${{ steps.prechange.outputs.minor }}"
          WARN="${{ steps.prechange.outputs.warning }}"
          UI="${{ steps.ndcontext.outputs.ui_url }}"
          SCOPE="${{ steps.changed.outputs.subnets }}"
          {
            echo "# ACI Change Analysis"
            echo ''
            echo "**Plan:** ${{ steps.summary.outputs.line }}"
            echo ''

            if [ -s nd-prechange.md ]; then
              echo '## 1. Nexus Dashboard pre-change analysis'
              echo ''
              echo "Baseline snapshot: \`${{ steps.baseline.outputs.snapshot_id || 'latest' }}\`"
              echo ''
              echo "🔗 [Nexus Dashboard pre-change analysis hub](${{ vars.ND_HOST }}${{ env.ND_PRECHANGE_UI_PATH }})"
              echo ''
              if [ "${CRIT:-0}" = "0" ] && [ "${MAJ:-0}" = "0" ]; then
                echo '✅ **No new critical or major anomalies predicted** for this change.'
              else
                echo "⚠️ **This change is predicted to introduce anomalies:** ${CRIT:-0} critical, ${MAJ:-0} major."
                echo ''
                echo 'The apply is blocked. Review the detail below.'
              fi
              echo ''
              echo '| severity | new |'
              echo '| --- | --- |'
              echo "| critical | ${CRIT:-0} |"
              echo "| major | ${MAJ:-0} |"
              echo "| minor | ${MIN:-0} |"
              echo "| warning | ${WARN:-0} |"
              echo ''
              if [ -s nd-violations.md ]; then
                echo '### Compliance rules violated'
                echo ''
                cat nd-violations.md
                echo ''
              fi
              if [ -s nd-compliance-warnings.md ]; then
                echo '#### Compliance reporting caveats'
                echo ''
                cat nd-compliance-warnings.md
                echo ''
              fi
              if [ -s nd-anomalies.md ]; then
                echo '<details><summary>Fabric anomaly context (filtered)</summary>'
                echo ''
                cat nd-anomalies.md
                echo ''
                echo '</details>'
                echo ''
              fi
              echo '<details><summary>Full Nexus Dashboard report</summary>'
              echo ''
              cat nd-prechange-clean.md 2>/dev/null || cat nd-prechange.md
              echo ''
              echo '</details>'
              echo ''
              echo '---'
              echo ''
            fi

            echo '## 2. Terraform plan'
            echo ''
            if [ "${{ steps.plan.outputs.exitcode }}" = "2" ]; then
              echo '⚠️ Changes detected - **Apply to APIC** is waiting for approval.'
            elif [ "${{ steps.plan.outputs.exitcode }}" = "0" ]; then
              echo '✅ No changes. Apply will be skipped.'
            else
              echo '❌ Plan did not complete - see the Plan step logs.'
            fi
            echo ''
            cat plan-summary.md 2>/dev/null || echo '_No summary._'
            echo ''
            echo "**Post-deploy test scope:** \`${SCOPE:-all configured subnets (full sweep)}\`"
            echo ''
            echo '<details><summary>Raw terraform plan output</summary>'
            echo ''
            echo '```hcl'
            head -c 50000 tfplan.txt
            echo '```'
            echo '</details>'

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/tfplan.txt
            ${{ env.WORKING_DIR }}/plan.json
            ${{ env.WORKING_DIR }}/plan-summary.md
            ${{ env.WORKING_DIR }}/changed-subnets.tsv
            ${{ env.WORKING_DIR }}/nd-prechange.md
            ${{ env.WORKING_DIR }}/nd-prechange-clean.md
            ${{ env.WORKING_DIR }}/nd-prechange.json
            ${{ env.WORKING_DIR }}/nd-anomalies.md
            ${{ env.WORKING_DIR }}/nd-violations.md
            ${{ env.WORKING_DIR }}/prechange-report.xml
          retention-days: 5
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ND_HOST:      ${{ vars.ND_HOST }}
          ND_FABRIC:    ${{ vars.ND_FABRIC }}
          ND_JOB_ID:    ${{ steps.prechange.outputs.job_id }}
          ND_UI_URL:    ${{ steps.ndcontext.outputs.ui_url }}
          ND_CRITICAL:  ${{ steps.prechange.outputs.critical }}
          ND_MAJOR:     ${{ steps.prechange.outputs.major }}
          PLAN_SUMMARY: ${{ steps.summary.outputs.line }}
          TEST_SCOPE:   ${{ steps.changed.outputs.subnets }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKING_DIR;
            const read = (f, fallback) => {
              try { return fs.readFileSync(`${dir}/${f}`, 'utf8'); }
              catch { return fallback; }
            };

            let nd = read('nd-prechange-clean.md', read('nd-prechange.md', '_No ND report._'));
            let plan = read('tfplan.txt', '_No plan output._');
            const anomalies = read('nd-anomalies.md', '');
            const caveats   = read('nd-compliance-warnings.md', '');
            if (nd.length   > 30000) nd   = nd.slice(0, 30000)   + '\n... truncated';
            if (plan.length > 30000) plan = plan.slice(0, 30000) + '\n... truncated';

            const crit    = process.env.ND_CRITICAL || '0';
            const maj     = process.env.ND_MAJOR    || '0';
            const host    = process.env.ND_HOST     || '';
            const uiUrl   = process.env.ND_UI_URL   || '';
            const planSum = process.env.PLAN_SUMMARY || 'unknown';
            const scope   = process.env.TEST_SCOPE || 'all configured subnets (full sweep)';

            const verdict = (crit === '0' && maj === '0')
              ? '✅ No new critical or major anomalies predicted.'
              : `⚠️ Predicted to introduce ${crit} critical and ${maj} major anomalies.`;

            // Prefer the URL the report itself reports; the hand-built path
            // does not match this ND build.
            const ndLink = uiUrl
              ? `🔗 [View this analysis in Nexus Dashboard](${uiUrl})`
              : (host ? `🔗 [Nexus Dashboard analysis hub](${host})` : '');

            const body = [
              '## ACI Change Analysis',
              '',
              '`' + planSum + '`',
              '',
              '### 1. Nexus Dashboard pre-change',
              '',
              verdict,
            ];

            if (ndLink) body.push('', ndLink);

            body.push(
              '',
              '| severity | new |',
              '| --- | --- |',
              `| critical | ${crit} |`,
              `| major | ${maj} |`
            );

            if (caveats.trim()) {
              body.push('', '#### Compliance reporting caveats', '', caveats.trim());
            }

            if (anomalies.trim()) {
              body.push(
                '',
                '<details><summary>Fabric anomaly context (filtered)</summary>',
                '',
                anomalies.trim(),
                '',
                '</details>'
              );
            }

            body.push(
              '',
              '<details><summary>Full ND report</summary>',
              '',
              nd,
              '',
              '</details>',
              '',
              '### 2. Terraform plan',
              '',
              '**Post-deploy test scope:** `' + scope + '`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>'
            );

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join('\n')
            });
  
  # ══════════════════════════════════════════════════════════
  # JOB 2 — Apply + post-change verification
  # main only, blocks on required reviewers.
  # ══════════════════════════════════════════════════════════
  apply:
    name: Apply to APIC
    needs: plan
    if: |
      needs.plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: [self-hosted, openshift, aci]
    environment: aci-tenant-emea-cto
    # gh-pages publishing pushes a commit with GITHUB_TOKEN, which requires
    # write. Job-level permissions override the workflow-level read default, so
    # the plan job stays read-only.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    # ND_USER / ND_PASSWORD must exist on the aci-tenant-emea-cto environment,
    # not only on the -plan environment.
    env:
      ND_HOST:     ${{ vars.ND_HOST }}
      ND_FABRIC:   ${{ vars.ND_FABRIC }}
      ND_USER:     ${{ secrets.ND_USER }}
      ND_PASSWORD: ${{ secrets.ND_PASSWORD }}
    steps:
      - name: Approval context
        run: |
          echo "Approved plan : ${{ needs.plan.outputs.summary }}"
          echo "ND baseline   : ${{ needs.plan.outputs.nd_snapshot }}"
          echo "ND prechange  : exit ${{ needs.plan.outputs.nd_exitcode }}"
          echo "ND anomalies  : ${{ needs.plan.outputs.nd_critical }} critical, ${{ needs.plan.outputs.nd_major }} major"
          echo "Test scope    : ${{ needs.plan.outputs.changed_subnets || 'full sweep' }}"
          echo "Commit        : ${{ github.sha }}"
          echo "Triggered by  : ${{ github.actor }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache dirs
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" "$TF_DATA_DIR"

      - name: Verify tools and ND settings
        run: |
          terraform version
          nac-analytics version
          echo "ND_HOST   : ${ND_HOST:-<EMPTY>}"
          echo "ND_FABRIC : ${ND_FABRIC:-<EMPTY>}"
          [ -n "$ND_USER" ]     && echo "ND_USER   : set"  || echo "::warning::ND_USER is EMPTY - add it to the aci-tenant-emea-cto environment"
          [ -n "$ND_PASSWORD" ] && echo "ND_PASSWORD: set" || echo "::warning::ND_PASSWORD is EMPTY - add it to the aci-tenant-emea-cto environment"

      # The connectivity suite needs SSHLibrary (which pulls paramiko) and dig.
      # Fail loudly here rather than letting every fabric test skip silently.
      - name: Verify nac-test fabric test dependencies
        continue-on-error: true
        run: |
          python3 -c "import SSHLibrary, paramiko; print('SSHLibrary', SSHLibrary.__version__, '/ paramiko', paramiko.__version__)" \
            || echo "::warning::SSHLibrary/paramiko not importable - fabric iping tests will fail to load. Install robotframework-sshlibrary into the interpreter that runs Robot."
          command -v dig >/dev/null && dig -v 2>&1 | head -1 \
            || echo "::warning::dig is missing - resolver tests will skip"
          command -v ping >/dev/null && echo "ping: present" \
            || echo "::warning::ping is missing - runner gateway tests will skip"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Init
        run: |
          : "${TF_STATE_CONN_STR:?TF_STATE_CONN_STR is empty}"
          terraform init -input=false -reconfigure \
            -backend-config="conn_str=${TF_STATE_CONN_STR}" \
            -backend-config="schema_name=${TF_STATE_SCHEMA}"
        env:
          TF_STATE_CONN_STR: ${{ secrets.TF_STATE_CONN_STR }}

      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s tfplan
        env:
          ACI_URL:      ${{ secrets.APIC_URL }}
          ACI_USERNAME: ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD: ${{ secrets.APIC_PASSWORD }}
          ACI_INSECURE: 'true'

      # ═══════════════ Post-change operational verification ═══════════════
      # SWITCH_USER / SWITCH_PASSWORD are passed as ENVIRONMENT variables, not
      # via --variable. Robot reads them with %{SWITCH_USER=} syntax. Passing a
      # password with --variable would place it in the process command line,
      # readable via /proc by anything in the same container.
      #
      # --processes 2 caps the SSH fan-out. ACI leaves limit concurrent sessions
      # per user, and exceeding it produces failures that look like fabric faults.
      #
      # NOTE: --exclude fabric-ping is deliberately ABSENT. The runner has L3Out
      # reachability to these public BD gateways, so that test is a real
      # bidirectional check and should gate.
      - name: nac-test - change verification
        id: nactest
        continue-on-error: true
        working-directory: .
        env:
          ACI_URL:         ${{ secrets.APIC_URL }}
          ACI_USERNAME:    ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD:    ${{ secrets.APIC_PASSWORD }}
          SWITCH_USER:     ${{ secrets.SWITCH_USER }}
          SWITCH_PASSWORD: ${{ secrets.SWITCH_PASSWORD }}
          # Robot reads these with %{VAR=} syntax. nac-test rejects --variable,
          # and the environment keeps credentials out of any command line.
          NODE_MGMT_MAP:   ${{ vars.NODE_MGMT_MAP }}
          CHANGED_SUBNETS: ${{ needs.plan.outputs.changed_subnets }}
          PYTHONWARNINGS:  'ignore:Unverified HTTPS request'
        run: |
          echo "test scope   : ${CHANGED_SUBNETS:-<full sweep>}"
          echo "node map     : ${NODE_MGMT_MAP:-<EMPTY - fabric tests will skip>}"
          [ -n "$SWITCH_USER" ] && echo "SWITCH_USER  : set" \
            || echo "::warning::SWITCH_USER is empty - fabric iping tests will skip"
          [ -n "$NODE_MGMT_MAP" ] \
            || echo "::warning::NODE_MGMT_MAP repo variable is not set - every fabric iping test will SKIP"

          set +e
          nac-test \
            -d "${WORKING_DIR}/data" \
            -d "${NAC_TEST_DEFAULTS}" \
            -t "${NAC_TEST_TEMPLATES}" \
            -f "${NAC_TEST_FILTERS}" \
            -o nac-test-results \
            --exclude baseline \
            --processes 2 \
            --minimal-reports
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Parse real per-test results from output.xml. Skipped tests are
          # neither passed nor failed - count them so the summary can state how
          # much was actually verified rather than implying full coverage.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET, sys
          try:
              t = ET.parse('nac-test-results/robot_results/output.xml')
          except Exception:
              print("total=0"); print("passed=0"); print("failed=0"); print("skipped=0")
              sys.exit(0)
          tests = list(t.iter('test'))
          def n(s):
              return sum(1 for x in tests if x.find('status').get('status') == s)
          print(f"total={len(tests)}")
          print(f"passed={n('PASS')}")
          print(f"failed={n('FAIL')}")
          print(f"skipped={n('SKIP')}")
          PY

          echo "nac-test exit ${code}"
          exit 0

      - name: nac-test - fabric baseline (informational)
        id: nactest_baseline
        continue-on-error: true
        working-directory: .
        env:
          ACI_URL:         ${{ secrets.APIC_URL }}
          ACI_USERNAME:    ${{ secrets.APIC_USERNAME }}
          ACI_PASSWORD:    ${{ secrets.APIC_PASSWORD }}
          SWITCH_USER:     ${{ secrets.SWITCH_USER }}
          SWITCH_PASSWORD: ${{ secrets.SWITCH_PASSWORD }}
          NODE_MGMT_MAP:   ${{ vars.NODE_MGMT_MAP }}
          PYTHONWARNINGS:  'ignore:Unverified HTTPS request'
        run: |
          set +e
          nac-test \
            -d "${WORKING_DIR}/data" \
            -d "${NAC_TEST_DEFAULTS}" \
            -t "${NAC_TEST_TEMPLATES}" \
            -f "${NAC_TEST_FILTERS}" \
            -o nac-test-baseline \
            --include baseline \
            --processes 2 \
            --minimal-reports
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          echo "baseline exit ${code} (informational only)"
          exit 0

      - name: Extract failed test detail
        if: always()
        working-directory: .
        run: |
          python3 - > nac-test-failures.md <<'PY'
          import xml.etree.ElementTree as ET, os
          rows = []
          ran = 0
          for label, path in (
              ("change", "nac-test-results/robot_results/output.xml"),
              ("baseline", "nac-test-baseline/robot_results/output.xml"),
          ):
              if not os.path.exists(path):
                  continue
              t = ET.parse(path)
              for tc in t.iter('test'):
                  ran += 1
                  st = tc.find('status')
                  if st.get('status') != 'FAIL':
                      continue
                  msg = ' '.join((st.text or '').split())[:160]
                  rows.append((label, tc.get('name'), msg))
          if rows:
              print('| scope | test | reason |')
              print('| --- | --- | --- |')
              for label, name, msg in rows:
                  name = name.replace('|', '\|')
                  msg = msg.replace('|', '\|')
                  print(f'| {label} | {name} | {msg} |')
          elif ran == 0:
              print('_No tests ran - nac-test did not produce output.xml. '
                    'Check the nac-test step logs._')
          else:
              print(f'_All {ran} tests passed._')
          PY
          cat nac-test-failures.md

      - name: Build step summary
        if: always()
        working-directory: .
        run: |
          TOTAL="${{ steps.nactest.outputs.total }}"
          PASSED="${{ steps.nactest.outputs.passed }}"
          FAILED="${{ steps.nactest.outputs.failed }}"
          SKIPPED="${{ steps.nactest.outputs.skipped }}"
          SCOPE="${{ needs.plan.outputs.changed_subnets }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UI="${{ needs.plan.outputs.nd_ui_url }}"
          {
            echo '# Applied to APIC'
            echo ''
            echo "Plan applied: **${{ needs.plan.outputs.summary }}**"
            echo ''
            echo "Pre-change prediction: ${{ needs.plan.outputs.nd_critical }} critical, ${{ needs.plan.outputs.nd_major }} major"
            echo ''
            echo "🔗 [Nexus Dashboard analysis hub](${{ vars.ND_HOST }}${{ env.ND_PRECHANGE_UI_PATH }})"
            echo ''
            echo '---'
            echo ''
            echo '## Post-change operational verification (nac-test)'
            echo ''
            echo "Scope: \`${SCOPE:-all configured subnets (full sweep)}\`"
            echo ''
            if [ "${FAILED:-0}" = "0" ] && [ "${TOTAL:-0}" != "0" ]; then
              echo "✅ **${PASSED:-0} of ${TOTAL} operational tests passed.** Fabric-sourced ICMP from each BD anycast gateway (iping on a border leaf, inside the tenant VRF), runner-sourced reachability to those same gateways over the L3Out, shared-services DNS resolution and outbound HTTPS."
            elif [ "${TOTAL:-0}" = "0" ]; then
              echo "⚠️ **No tests ran** - check the nac-test step logs (template render, missing SSHLibrary, or credential failure)."
            else
              echo "❌ **${FAILED} of ${TOTAL} operational tests failed.** The change is applied; investigate below."
            fi
            if [ "${SKIPPED:-0}" != "0" ]; then
              echo ''
              echo "ℹ️ ${SKIPPED} test(s) skipped - either outside the change scope, or NODE_MGMT_MAP / SWITCH_USER not configured. Skipped tests verified nothing."
            fi
            echo ''
            echo '| result | count |'
            echo '| --- | --- |'
            echo "| passed | ${PASSED:-0} |"
            echo "| failed | ${FAILED:-0} |"
            echo "| skipped | ${SKIPPED:-0} |"
            echo "| total | ${TOTAL:-0} |"
            echo ''
            echo "📊 **[Download the full HTML report](${RUN_URL}#artifacts)** — open \`report.html\` for the interactive Robot Framework dashboard."
            echo ''
            echo "📊 **[Open the interactive test report](https://conmurphy.github.io/nac-webinar/reports/run-${{ github.run_number }}/)**"
            echo ''
            if [ -s nac-test-failures.md ]; then
              echo '<details open><summary>Failed tests</summary>'
              echo ''
              cat nac-test-failures.md
              echo ''
              echo '</details>'
            fi
            echo ''
            echo '> Fabric baseline tests (management-VRF reachability, external HTTPS, name resolution) run separately and are informational - they reflect pre-existing fabric and upstream state, not this change.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nac-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nac-test-reports
          path: |
            nac-test-results/combined_summary.html
            nac-test-results/robot_results/report.html
            nac-test-results/robot_results/log.html
            nac-test-results/robot_results/output.xml
            nac-test-results/robot_results/xunit.xml
            nac-test-baseline/robot_results/report.html
            nac-test-baseline/robot_results/log.html
            nac-test-failures.md
          retention-days: 30
          if-no-files-found: warn

      - name: Publish report to Pages
        id: pages
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: .
        run: |
          DEST="reports/run-${{ github.run_number }}"
          mkdir -p "gh-pages/${DEST}"

          # Stop Jekyll touching anything, and make the branch root serve.
          touch gh-pages/.nojekyll

          copied=0
          for f in nac-test-results/robot_results/report.html \
                   nac-test-results/robot_results/log.html \
                   nac-test-results/combined_summary.html; do
            if [ -f "$f" ]; then
              cp "$f" "gh-pages/${DEST}/"
              copied=$((copied+1))
            else
              echo "missing (skipped): $f"
            fi
          done

          if [ "$copied" = "0" ]; then
            echo "::warning::No nac-test HTML found - nothing to publish for ${DEST}"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A directory with no index.html is a 404 on Pages. Pick the best
          # available file as index rather than relying on combined_summary.
          if [ ! -f "gh-pages/${DEST}/index.html" ]; then
            if   [ -f "gh-pages/${DEST}/combined_summary.html" ]; then
              cp "gh-pages/${DEST}/combined_summary.html" "gh-pages/${DEST}/index.html"
            elif [ -f "gh-pages/${DEST}/report.html" ]; then
              cp "gh-pages/${DEST}/report.html" "gh-pages/${DEST}/index.html"
            fi
          fi

          [ -f "gh-pages/${DEST}/index.html" ] \
            && echo "published=true"  >> "$GITHUB_OUTPUT" \
            || echo "published=false" >> "$GITHUB_OUTPUT"

          # Root landing page listing published runs. Regenerated each time;
          # keep_files:true means older run dirs persist on the branch.
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>nac-webinar test reports</title>'
            echo '<h1>ACI NaC post-deploy test reports</h1><ul>'
            echo "<li><a href=\"reports/run-${{ github.run_number }}/\">run-${{ github.run_number }}</a> — ${{ github.sha }}</li>"
            echo '</ul>'
            echo '<p>Older runs are at <code>reports/run-&lt;N&gt;/</code>.</p>'
          } > gh-pages/index.html

          echo "--- ${DEST} ---"
          ls -l "gh-pages/${DEST}"

      - name: Deploy to Pages
        id: deploy
        if: always() && github.ref == 'refs/heads/main' && steps.pages.outputs.published == 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true

      - name: Report Pages outcome
        if: always() && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          PUB="${{ steps.pages.outputs.published }}"
          DEP="${{ steps.deploy.outcome }}"
          URL="https://conmurphy.github.io/nac-webinar/reports/run-${{ github.run_number }}/"
          echo "published=${PUB} deploy_outcome=${DEP}"
          if [ "$PUB" != "true" ]; then
            echo "::warning::No HTML was staged - nac-test produced no report. ${URL} will 404."
          elif [ "$DEP" != "success" ]; then
            echo "::error::gh-pages deploy failed (${DEP}). Check that the apply job has 'permissions: contents: write'. ${URL} will 404."
          else
            echo "published to ${URL} - allow ~1 min for the Pages build"
          fi